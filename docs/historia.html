<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirada Larga MECOPOL</title>
<meta name="description" content="Inflación por gobierno desde 2003: Kirchner, Cristina Fernández, Macri, Alberto Fernández y Milei. Borrador de análisis. Mesa de Economía Política UNLa.">
<link rel="icon" type="image/png" href="img/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: misma columna de lectura que la portada. Banner bordó, tarjetas por gobierno,
   después la serie larga, los años y la tabla de mandatos. Tema oscuro único. */
:root {
  color-scheme: dark;
  --bg:       #0e1014;
  --panel:    #14171c;
  --panel-hi: #1b1f26;
  --line:     #23272f;
  --grid:     #1f232a;
  --fg:       #e3e5ea;
  --fg-2:     #a3a9b6;
  --fg-3:     #6f7685;
  --marca:    #950b32;
  --warn:     #e0a33a;
  --font-ui:  "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-ui); padding-inline: 16px; padding-block: 0 48px; }
a { color: var(--fg); text-underline-offset: 2px; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.wrap { max-width: 1200px; margin-inline: auto; display: flex; flex-direction: column; gap: 40px; padding-top: 28px; }

/* ---- banner ---- */
.banda { margin-inline: -16px; padding: 24px 16px 22px; background: var(--marca); color: #fff; border-bottom: 3px solid #6e0824; }
.banda-in { max-width: 1200px; margin-inline: auto; display: flex; align-items: center; gap: 22px; }
.marca { flex: none; display: block; background: #fff; border-radius: 10px; padding: 6px; box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.marca img { display: block; width: 92px; height: auto; }
.banda-txt { flex: 1; min-width: 0; display: grid; gap: 10px; }
.eyebrow { font: 600 12px var(--font-ui); font-stretch: 80%; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.78); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.borrador { padding: 1px 8px; border: 1px solid rgba(255,255,255,.55); border-radius: 3px; color: #fff; letter-spacing: .1em; }
h1 { margin: 0; font-weight: 600; font-stretch: 85%; letter-spacing: -.01em; color: #fff; font-size: clamp(26px, 4vw, 42px); line-height: 1.08; text-wrap: balance; }
.bajada { margin: 0; color: rgba(255,255,255,.82); max-width: 62ch; font-size: 15px; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { font-size: 13px; text-decoration: none; color: rgba(255,255,255,.8); padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,.25); }
.nav a[aria-current="page"] { background: rgba(0,0,0,.25); color: #fff; border-color: transparent; }
.nav a:hover { color: #fff; border-color: rgba(255,255,255,.6); }
@media (max-width: 560px) { .banda-in { flex-direction: column; align-items: flex-start; gap: 14px; } .marca img { width: 72px; } }

/* ---- tarjetas por gobierno ---- */
.gobs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.gob { padding: 18px 16px 16px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.gob + .gob { border-left: 1px solid var(--line); }
.gob h2 { margin: 0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.gob h2 i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.gob .per { font: 12px var(--font-num); color: var(--fg-3); }
.gob .valor { font: 600 30px/1.1 var(--font-num); letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-top: 8px; }
.gob .valor small { font-size: 15px; color: var(--fg-3); margin-left: 1px; }
.gob .lbl { font-size: 12px; color: var(--fg-2); }
.gob .sec2 { font-size: 12px; color: var(--fg-3); margin-top: 6px; }
.gob .sec2 b { font-family: var(--font-num); color: var(--fg-2); font-weight: 500; }
.chip { display: inline-block; padding: 0 6px; border-radius: 3px; font: 500 11px var(--font-num); border: 1px solid currentColor; color: var(--warn); }
@media (max-width: 1100px) {
  .gobs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .gob:nth-child(4) { border-left: 0; } .gob:nth-child(n+4) { border-top: 1px solid var(--line); }
}
@media (max-width: 560px) {
  .gobs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gob:nth-child(n) { border-left: 0; border-top: 1px solid var(--line); }
  .gob:nth-child(2n) { border-left: 1px solid var(--line); }
  .gob:nth-child(-n+2) { border-top: 0; }
}

/* ---- secciones ---- */
.sec { display: grid; gap: 14px; }
.sec-cab { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 20px; }
.sec-cab > div { flex: 1 1 320px; min-width: 0; }
.sec h2 { margin: 0; font-size: 20px; font-weight: 600; font-stretch: 90%; text-wrap: balance; }
.sec p.sub { margin: 4px 0 0; color: var(--fg-2); font-size: 14px; max-width: 70ch; }
.caja { background: var(--panel); border-radius: var(--r); padding: 16px; min-width: 0; }
.chart { width: 100%; height: 380px; }
@media (max-width: 560px) { .chart { height: 320px; } }
.seg { display: inline-flex; background: var(--panel); border-radius: var(--r); padding: 3px; gap: 2px; }
.seg button { font: 500 13px var(--font-ui); color: var(--fg-2); background: transparent; border: 0; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel-hi); color: var(--fg); }
.seg button:hover { color: var(--fg); }
.lectura { margin: 0; color: var(--fg-2); font-size: 14px; max-width: 74ch; }
.lectura b { color: var(--fg); font-weight: 600; }

/* franja de fuentes bajo la serie */
.fuentes-tira { display: flex; height: 22px; border-radius: 3px; overflow: hidden; font: 11px/22px var(--font-num); color: var(--fg); margin-top: 8px; }
.fuentes-tira span { padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fuentes-tira .indec { background: #262b33; } .fuentes-tira .cifra { background: #3a2f1a; color: #f0d79a; }

.leyenda { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--fg-3); }
.leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.leyenda i.raya { background: repeating-linear-gradient(45deg, #8a909c 0 2px, transparent 2px 5px); border: 1px solid #8a909c; }

/* ---- tablas ---- */
.tabla-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px; }
th, td { padding: 9px 10px; text-align: right; white-space: nowrap; }
th { color: var(--fg-3); font-weight: 500; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid var(--line); vertical-align: bottom; }
td { font-family: var(--font-num); font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
td:first-child { font-family: var(--font-ui); }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--panel-hi); }
.nom { display: inline-flex; align-items: center; gap: 8px; }
.nom i { width: 10px; height: 10px; border-radius: 2px; }
td.dif { color: var(--warn); }
td .mute { color: var(--fg-3); }
.tabla-chica table { min-width: 520px; }

/* ---- notas ---- */
.notas { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px 32px; border-top: 1px solid var(--line); padding-top: 22px; }
.notas h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
.notas p { margin: 0; font-size: 13px; color: var(--fg-2); max-width: 62ch; }
.notas a { color: var(--fg-2); }
.estado { padding: 60px 0; color: var(--fg-2); }
.aviso { padding: 9px 13px; border-radius: var(--r); font-size: 13px; background: #221d10; color: #e9cf8f; border: 1px solid #4d3f19; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

    const dibS = esc => chS.setOption({
      grid: { left: 4, right: 24, top: 30, bottom: 4, containLabel: true },
      tooltip: Object.assign(tip(), { formatter: p => { const x = S[p[0].dataIndex];
        return `${largo(x.fecha)}<br>Interanual: <b>${pct(x.interanual, 1)}</b><br><span style="color:${T.fg3}">${x.fuente}</span>`; } }),
      xAxis: ejeX({ type: 'category', data: xs, boundaryGap: false, axisLabel: { color: T.fg3, fontFamily: T.num, fontSize: 11, formatter: v => v.slice(0, 4), interval: (i, v) => v.endsWith('-01') && +v.slice(0, 4) % 2 === 0 } }),
      yAxis: esc === 'log' ? ejeY({ type: 'log', logBase: 10, min: 1 }) : ejeY({ min: 0 }),
      series: [{ type: 'line', data: S.map(x => x.interanual), symbol: 'none', lineStyle: { width: 2, color: T.fg },
        markArea: { silent: true, data: bandas } }],
    }, { replaceMerge: ['series', 'yAxis'] });
    dibS('lin'); seguir('sel-escala', dibS);
    const total = xs.length;
    document.getElementById('tira').innerHTML = d.empalme.map(e => {
      const n = xs.filter(f => f >= e.desde && f <= e.hasta).length;
      return n ? `<span class="${e.fuente === 'CIFRA-CTA' ? 'cifra' : 'indec'}" style="width:${(n / total * 100).toFixed(2)}%" title="${e.fuente}: ${e.serie}">${e.fuente}</span>` : '';
    }).join('');

    // ---------- barras anuales ----------
    const A = d.anual, colA = a => byId[a.gobierno] ? byId[a.gobierno].color : T.fg3;
    nuevo(document.getElementById('ch-anual'), {
      grid: { left: 4, right: 16, top: 24, bottom: 4, containLabel: true },
      tooltip: Object.assign(tip(), { axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(255,255,255,.04)' } },
        formatter: p => { const a = A[p[0].dataIndex];
          return `<b>${a.anio}</b>${a.parcial ? ` (hasta ${etq(a.hasta)})` : ''} · ${byId[a.gobierno].corto}<br>${a.fuente === 'CIFRA-CTA' ? 'CIFRA-CTA' : 'INDEC'}: <b>${pct(a.variacion, 1)}</b>` +
            (a.oficial ? `<br>INDEC oficial: <b>${pct(a.oficial.variacion, 1)}</b>${a.oficial.meses < 12 ? ` (${a.oficial.meses} meses)` : ''}` : ''); } }),
      xAxis: ejeX({ type: 'category', data: A.map(a => a.parcial ? `${a.anio}*` : String(a.anio)), axisLabel: { color: T.fg3, fontFamily: T.num, fontSize: 11, hideOverlap: true } }),
      yAxis: ejeY({}),
      series: [
        { name: 'Serie principal', type: 'bar', barGap: '8%', barMaxWidth: 26,
          data: A.map(a => ({ value: a.variacion, itemStyle: { color: colA(a), opacity: a.parcial ? .55 : 1, borderRadius: [3, 3, 0, 0] } })),
          label: { show: true, position: 'top', fontFamily: T.num, fontSize: 10, color: T.fg2, formatter: p => nf(p.value, 0) } },
        { name: 'INDEC oficial', type: 'bar', barMaxWidth: 26,
          data: A.map(a => a.oficial ? { value: a.oficial.variacion, itemStyle: { color: { image: rayas(colA(a)), repeat: 'repeat' }, borderColor: colA(a), borderWidth: 1, borderRadius: [3, 3, 0, 0] } } : null),
          label: { show: true, position: 'top', fontFamily: T.num, fontSize: 10, color: T.fg3, formatter: p => p.value == null ? '' : nf(p.value, 0) } },
      ],
    });

    // ---------- trayectorias ----------
    const chT = nuevo(document.getElementById('ch-tray'), {});
    const maxN = Math.max(...G.map(g => g.trayectoria.length));
    const dibT = esc => chT.setOption({
      grid: { left: 4, right: 110, top: 34, bottom: 28, containLabel: true },
      legend: { top: 0, left: 0, textStyle: { color: T.fg2, fontSize: 12 }, itemWidth: 14, itemHeight: 3, icon: 'rect' },
      tooltip: Object.assign(tip(), { formatter: p => `Mes ${p[0].value[0]} de gobierno<br>` +
        p.map(s => `${marca(s.color)}${s.seriesName}: <b>${pct(s.value[1] - 100, 0)}</b>`).join('<br>') }),
      xAxis: ejeX({ type: 'value', min: 0, max: Math.ceil((maxN - 1) / 12) * 12, interval: 12, name: 'meses de gobierno', nameLocation: 'middle', nameGap: 24,
        nameTextStyle: { color: T.fg3, fontSize: 11 }, axisLabel: { color: T.fg3, fontFamily: T.num, fontSize: 11 } }),
      yAxis: esc === 'log' ? ejeY({ type: 'log', logBase: 10, min: 100, axisLabel: { color: T.fg3, fontFamily: T.num, fontSize: 11, formatter: v => nf(v, 0) } })
                           : ejeY({ min: 100, axisLabel: { color: T.fg3, fontFamily: T.num, fontSize: 11, formatter: v => nf(v, 0) } }),
      series: G.map(g => ({ name: g.corto, type: 'line', symbol: 'none', lineStyle: { width: 2, color: g.color }, itemStyle: { color: g.color },
        data: g.trayectoria.map((v, i) => [i, 100 + v]),
        endLabel: { show: true, color: T.fg, fontFamily: T.num, fontSize: 11, formatter: p => `${g.corto} ${nf(p.value[1], 0)}` } })),
    }, { replaceMerge: ['series', 'yAxis'] });
    dibT('log'); seguir('sel-tray', dibT);
  }

  // patrón rayado para las barras "INDEC oficial"
  function rayas(color) {
    const c = document.createElement('canvas'); c.width = c.height = 6;
    const x = c.getContext('2d'); x.fillStyle = 'rgba(0,0,0,0)'; x.fillRect(0, 0, 6, 6);
    x.strokeStyle = color; x.lineWidth = 1.5; x.beginPath(); x.moveTo(0, 6); x.lineTo(6, 0); x.moveTo(-1, 1); x.lineTo(1, -1); x.moveTo(5, 7); x.lineTo(7, 5); x.stroke();
    return c;
  }

  fetch('data/historia.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(e => { document.getElementById('app').innerHTML = '<div class="estado">No se pudo cargar la serie histórica (data/historia.json). Revisá que la Action haya corrido.</div>'; console.error(e); });
})();
</script>
</body>
</html>
