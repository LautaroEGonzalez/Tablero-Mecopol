<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#950b32">
<title>Tablero de Precios MECOPOL</title>
<meta name="description" content="Inflación durante el gobierno de Milei con datos del INDEC: mes a mes y por rubro. Mesa de Economía Política UNLa.">
<link rel="icon" type="image/png" href="img/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Public+Sans:wght@400..800&display=swap">
<style>
/* Tablero MECOPOL — afiche de universidad pública: tintas planas sobre papel.
   Lo oficial va en bordó; lo estimado por MECOPOL, siempre en tinta negra con rosa.
   Sin sombras, degradados ni desenfoque. Como se inserta por iframe, ningún alto
   depende del viewport. */
:root {
  color-scheme: light;
  --bordo:     #950b32;
  --bordo-osc: #6d0623;
  --crema:     #f7efe6;
  --negro:     #1a0a10;
  --rosa:      #ff8bae;
  --rosa-hist: #dd7a96;   /* historial sobre bordó: 3:1 */
  --hist:      #bc677a;   /* historial sobre papel: tinte sólido de bordó, 3:1 */
  /* tintas del contexto; la sección de la estimación las redefine */
  --fondo:     var(--crema);
  --txt:       var(--negro);
  --txt-2:     #5e4a50;
  --acento:    var(--bordo);
  --sobre-ac:  var(--crema);
  --linea:     rgba(26,10,16,.2);
  --resalta:   rgba(26,10,16,.05);
  --display: "Anton", "Arial Narrow", sans-serif;
  --ui: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --m: max(clamp(16px, 3.4vw, 48px), calc((100vw - 1344px) / 2));
}
* { box-sizing: border-box; }
html { scroll-padding-top: 75px; scrollbar-color: var(--bordo) var(--crema); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
html, body { margin: 0; }
body {
  background: var(--crema); color: var(--negro);
  font: 400 16px/1.5 var(--ui);
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
::selection { background: var(--bordo); color: var(--crema); }
a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid currentColor; outline-offset: 2px; }
.oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---- banda de navegación ---- */
.cab {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px 20px;
  padding: 10px var(--m); background: var(--bordo); color: var(--crema);
}
.marca { flex: none; display: block; background: #fff; padding: 3px; }
.marca img { display: block; width: 50px; height: auto; }
.cab-txt { min-width: 0; margin-right: auto; }
h1 { margin: 0; font: 800 19px/1.2 var(--ui); text-wrap: balance; }
.cab-txt p { margin: 2px 0 0; font-size: 13px; line-height: 1.3; }
.secs { display: flex; gap: 2px; flex: none; }
.secs a {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 11px;
  font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap;
  box-shadow: inset 0 0 0 0 var(--crema); transition: box-shadow .15s;
}
.secs a:hover { box-shadow: inset 0 -2px 0 0 var(--crema); }
.secs a[aria-current="true"] { box-shadow: inset 0 -3px 0 0 var(--crema); font-weight: 700; }
.secs a[hidden] { display: none; }
@media (max-width: 1040px) {
  /* en pantallas angostas solo queda fija la fila de secciones; el script mide cuánto esconder */
  .cab { flex-wrap: wrap; padding-bottom: 0; }
  .cab-txt { flex: 1 1 0; }
  .secs { flex: 1 0 100%; overflow-x: auto; scrollbar-width: none; margin-inline: -8px; }
  .secs::-webkit-scrollbar { display: none; }
  .secs a { flex: none; padding: 0 9px; }
}

/* ---- avisos de estado ---- */
.aviso, .espera { background: var(--crema); color: var(--negro); font-size: 14px; }
.aviso { padding: 12px var(--m); border-bottom: 3px solid var(--bordo); }
.espera { padding: 11px 14px; border: 3px solid var(--bordo); }
.espera b { font-weight: 700; }
.estado { padding: 72px var(--m); color: var(--txt-2); font-size: 18px; }

/* ---- campo bordó: la cifra del mes ---- */
.hero {
  container-type: inline-size;
  background: var(--bordo); color: var(--crema); padding-inline: var(--m); overflow: hidden;
}
.hero-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); gap: 40px; align-items: stretch; min-height: 340px; }
.num {
  --n: 4; align-self: end; margin: 0 0 calc(20px - .041em); padding: 0;
  font: 400 min(calc((100cqw - 440px) * .92 / (.44 * var(--n) + .25)), 270px)/1.16 var(--display);
  white-space: nowrap;
}
.num small { font-size: .5em; color: var(--rosa); }
.hero-der { display: flex; flex-direction: column; padding-top: 22px; text-align: right; }
.hero h2 { margin: 0 0 12px; font: 400 clamp(32px, 3.2cqw, 46px)/1.06 var(--display); text-wrap: balance; }
.hero-der p { margin: 0; font-size: 16px; line-height: 1.4; }
.mandato { margin-top: 14px; display: grid; gap: 6px; font-size: 13px; }
.mandato .barra { height: 6px; background: var(--bordo-osc); }
.mandato .barra i { display: block; height: 100%; background: var(--crema); }
.mandato .txt { display: flex; justify-content: space-between; gap: 12px; }
.mandato .txt span:first-child, .mandato .txt span:last-child { white-space: nowrap; }
.mandato b { font-weight: 700; }
.anio { margin-top: auto; padding: 18px 0 20px; }
.anio .ejes { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
.barras { display: flex; align-items: flex-end; gap: 6px; height: 80px; }
.barras i { flex: 1; background: var(--rosa-hist); transform-origin: bottom; }
.barras i.ult { background: var(--crema); }
@media (prefers-reduced-motion: no-preference) {
  .barras i { animation: sube .7s cubic-bezier(.16, 1, .3, 1) backwards; animation-delay: calc(var(--i) * 35ms); }
  @keyframes sube { from { transform: scaleY(0); } }
}
@media (max-width: 1040px) {
  .hero-in { display: flex; flex-direction: column; gap: 0; min-height: 0; }
  .hero-der { display: contents; text-align: left; }
  .hero h2 { order: 1; margin: 18px 0 0; }
  .num { order: 2; align-self: flex-start; margin: 0; padding: 4px 0 2px; font-size: min(calc(72cqw / (.44 * var(--n) + .25)), 170px); }
  .hero-der > p { order: 3; }
  .mandato { order: 4; }
  .anio { order: 5; margin-top: 0; padding: 16px 0 18px; }
  .barras { height: 56px; }
}

/* ---- las otras cifras ---- */
.cifras { container-type: inline-size; }
.cifras-in { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.2fr); padding-inline: var(--m); }
.cifra { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 28px 20px 30px; border-right: 3px solid var(--bordo); }
.cifra:first-child { padding-left: 0; }
.cifra h3 { margin: 0; font-size: 15px; font-weight: 600; }
.valor { font: 400 clamp(52px, 5.6cqw, 88px)/1.16 var(--display); color: var(--acento); white-space: nowrap; }
.valor small { font-size: 1em; }
.cifra .pie { margin: 0; font-size: 14px; color: var(--txt-2); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--txt); white-space: nowrap; }
.chip svg { width: 9px; height: 9px; fill: currentColor; }
.spark { width: 100%; height: 46px; margin-top: auto; }
.spark:empty { display: none; }
.cifra.est { position: relative; background: var(--negro); color: var(--crema); border-right: 0; --acento: var(--rosa); --txt-2: #c9b7bc; }
/* el bloque negro llega hasta el borde de la pantalla, más allá del margen */
.cifra.est::after { content: ""; position: absolute; top: 0; bottom: 0; left: 100%; width: var(--m); background: var(--negro); }
.cifra.est a { font-weight: 600; }
@media (max-width: 1040px) {
  .cifras-in { grid-template-columns: repeat(2, minmax(0, 1fr)); padding-inline: 0; }
  .cifra { padding: 20px 16px 22px; border-bottom: 3px solid var(--bordo); }
  .cifra:first-child { padding-left: var(--m); }
  .cifra:nth-child(2n) { border-right: 0; }
  .cifra.est::after { display: none; }
  .cifra:nth-child(3) { padding-left: var(--m); }
  .cifra.est { padding-right: 16px; border-bottom: 0; }
  .cifra:last-child:nth-child(3) { grid-column: 1 / -1; border-right: 0; }
  .valor { font-size: clamp(44px, 13.4cqw, 76px); }
}

/* ---- secciones ---- */
.sec {
  background: var(--fondo); color: var(--txt);
  display: grid; gap: 22px; padding: clamp(48px, 6vw, 84px) var(--m); border-top: 3px solid var(--bordo);
}
.sec > * { min-width: 0; }
.sec-cab { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 28px; }
.sec-cab > div:first-child { flex: 1 1 340px; min-width: 0; }
.sec h2 { margin: 0; font: 400 clamp(38px, 4.6vw, 62px)/1.08 var(--display); color: var(--acento); text-wrap: balance; }
.sec h3.sub-t { margin: 0; font: 400 clamp(26px, 2.8vw, 34px)/1.15 var(--display); }
.sec p.sub { margin: 8px 0 0; color: var(--txt-2); max-width: 68ch; }
.sec p.sub b { color: var(--txt); }
.sub-cab { margin-top: 26px; }
.caja { min-width: 0; border-top: 3px solid var(--txt); padding-top: 16px; }
.chart { width: 100%; height: 400px; }
@media (max-width: 560px) { .chart { height: 300px; } }

.seg { display: inline-flex; flex-wrap: wrap; border: 2px solid var(--acento); }
.seg button {
  font: 600 14px var(--ui); color: var(--acento); background: transparent; border: 0;
  min-height: 44px; padding: 0 16px; cursor: pointer; transition: background-color .15s, color .15s;
}
.seg button:hover { background: var(--resalta); }
.seg button[aria-pressed="true"] { background: var(--acento); color: var(--sobre-ac); }
.seg button:focus-visible { outline-offset: -5px; }

.lectura { margin: 0; color: var(--txt-2); max-width: 72ch; }
.lectura b { color: var(--txt); font-weight: 700; }

/* ---- tablas ---- */
.tabla-wrap { overflow-x: auto; scrollbar-color: var(--acento) transparent; }
table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 640px; font-variant-numeric: tabular-nums; }
th, td { padding: 10px; text-align: right; white-space: nowrap; }
th { color: var(--txt-2); font-weight: 600; font-size: 13px; border-bottom: 1px solid var(--txt); vertical-align: bottom; }
td { border-bottom: 1px solid var(--linea); }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
td:first-child { font-weight: 500; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--resalta); }
th.rel, td.rel { width: 38%; text-align: center; }
.div { display: grid; grid-template-columns: 1fr 1fr; align-items: center; position: relative; height: 20px; }
.div::after { content: ""; position: absolute; left: 50%; top: -6px; bottom: -6px; width: 1px; background: var(--txt); }
.div .izq, .div .der { display: flex; align-items: center; gap: 6px; height: 100%; }
.div .izq { justify-content: flex-end; }
.div .pista { flex: 1; display: flex; height: 12px; }
.div .izq .pista { justify-content: flex-end; }
.div i { display: block; height: 12px; min-width: 2px; }
.div .izq i { background: var(--negro); }
.div .der i { background: var(--bordo); }
.div span { flex: none; width: 52px; font-size: 13px; color: var(--txt-2); }
.div .der span { text-align: left; } .div .izq span { text-align: right; }

/* ---- regiones ---- */
.reg-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 36px; align-items: stretch; }
@media (max-width: 900px) { .reg-grid { grid-template-columns: 1fr; } }
.reg-der { display: flex; flex-direction: column; gap: 22px; }
.mapa { width: 100%; height: 600px; }
@media (max-width: 560px) { .mapa { height: 480px; } }
.reg tr.nac td { border-top: 1px solid var(--txt); color: var(--txt-2); }
.reg table { min-width: 0; font-size: 14px; }
.reg th, .reg td { padding: 8px 6px; }
.reg th { white-space: normal; }
@media (min-width: 901px) { .reg td { padding: 19px 6px; } }
.calor table { min-width: 720px; font-size: 14px; border-collapse: separate; border-spacing: 2px; }
.calor th, .calor td { padding: 8px; border-bottom: 0; }
.calor td { text-align: center; }
.calor td:first-child { text-align: left; padding-left: 0; }
.calor th:not(:first-child) { text-align: center; }
.calor td.nac { color: var(--txt-2); }
.calor td.cel { color: var(--negro); }
.calor td.max { font-weight: 800; background: var(--bordo); color: var(--crema); }
/* tablas anchas: la primera columna queda fija al deslizar */
.fija th:first-child, .fija td:first-child { position: sticky; left: 0; background: var(--fondo); z-index: 1; }
.fija tbody tr:hover td:first-child { background: var(--fondo); }
.desliza { display: none; margin: 0 0 8px; font-size: 13px; color: var(--txt-2); }
@media (max-width: 700px) {
  .desliza { display: block; }
  .calor table { min-width: 640px; font-size: 13px; }
  .calor th, .calor td { padding: 7px 5px; }
  .fija td:first-child { max-width: 118px; white-space: normal; line-height: 1.25; }
}
.nota-reg { margin: 0; font-size: 14px; color: var(--txt-2); max-width: 80ch; }

/* ---- rubros ---- */
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 14px; color: var(--txt-2); }
.leyenda i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }

/* ---- la estimación de MECOPOL: siempre en tinta negra con rosa ---- */
.tinta-negra {
  --fondo: var(--negro); --txt: var(--crema); --txt-2: #c9b7bc;
  --acento: var(--rosa); --sobre-ac: var(--negro);
  --linea: rgba(247,239,230,.22); --resalta: rgba(247,239,230,.07);
  border-top: 0;
}
.tinta-negra ::selection { background: var(--rosa); color: var(--negro); }
.comp { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-block: 1px solid var(--linea); }
.comp > div { padding: 16px 20px 18px; display: grid; gap: 4px; min-width: 0; border-right: 1px solid var(--linea); }
.comp > div:first-child { padding-left: 0; }
.comp > div:last-child { border-right: 0; }
.comp h3 { margin: 0; font-size: 14px; font-weight: 600; }
.comp .par { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.comp .par b { font: 400 clamp(38px, 3.6vw, 50px)/1.16 var(--display); color: var(--acento); }
.comp .par span { font-size: 14px; color: var(--txt-2); }
.comp .dif { font-size: 13px; font-weight: 500; color: var(--txt-2); }
@media (max-width: 900px) {
  .comp { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .comp > div { padding: 14px 14px 16px; }
  .comp > div:nth-child(odd) { padding-left: 0; }
  .comp > div:nth-child(2n) { border-right: 0; }
}
.dos-col { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 36px; }
.dos-igual { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px; }
.dos-igual .chart { height: 340px; }
.dos-igual h3.sub-t { margin: 0 0 8px; }
.dos-igual .leyenda { margin-top: 10px; }
@media (max-width: 900px) { .dos-col, .dos-igual { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .dos-igual .chart { height: 280px; } }
.otras td.txt { color: var(--txt-2); white-space: normal; text-align: left; }
.otras th:nth-child(2) { text-align: left; }
.otras th:last-child, .otras td:last-child b { color: var(--acento); }
.mute { color: var(--txt-2); }
.pond td.d-mas { color: var(--acento); font-weight: 700; } .pond td.d-menos { color: var(--txt-2); }
.pond table { min-width: 0; font-size: 14px; }
.pond table.otras { min-width: 640px; }
.pond th, .pond td { padding: 8px 6px; }
.pond th { white-space: normal; }
@media (max-width: 560px) {
  .otras-caja .desliza { display: none; }
  .pond table.otras { min-width: 0; }
  .otras thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .otras tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px 10px; padding: 12px 0; border-bottom: 1px solid var(--linea); }
  .otras tr:last-child { border-bottom: 0; }
  .pond .otras td { display: block; padding: 0; border: 0; text-align: left; white-space: normal; }
  .fija .otras td:first-child { position: static; max-width: none; font-weight: 700; }
  .otras td:nth-child(-n+2) { grid-column: 1 / -1; }
  .otras td[data-l]::before { content: attr(data-l); display: block; margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--txt-2); }
  .otras td:last-child[data-l]::before { color: var(--acento); }
}
.reg th:first-child, .reg td:first-child, .pond th:first-child, .pond td:first-child, .calor th:first-child { padding-left: 0; }

/* ---- pie ---- */
.notas {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px 36px;
  background: var(--bordo); color: var(--crema); padding: 44px var(--m) 52px;
}
.notas h3 { margin: 0 0 6px; font: 400 24px/1.15 var(--display); }
.notas p { margin: 0; font-size: 14px; max-width: 62ch; }
code { font-size: 13px; background: var(--bordo-osc); padding: 1px 5px; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="cab">
  <a class="marca" href="https://mecopolunla.wixsite.com/mecopol" target="_blank" rel="noopener">
    <img src="img/logo-mecopol.png" width="320" height="316" alt="MECOPOL · Mesa de Economía Política · Universidad Nacional de Lanús">
  </a>
  <div class="cab-txt">
    <h1>Inflación en el gobierno de Milei</h1>
    <p>Tablero de precios · Mesa de Economía Política UNLa · Datos: INDEC</p>
  </div>
  <nav class="secs" aria-label="Secciones" id="secs">
    <a href="#sec-mes" data-s="sec-mes">Último mes</a>
    <a href="#sec-serie" data-s="sec-serie">Serie</a>
    <a href="#sec-regiones" data-s="sec-regiones">Regiones</a>
    <a href="#sec-rubros" data-s="sec-rubros">Rubros</a>
    <a href="#sec-salarios" data-s="sec-salarios">Salarios</a>
    <a href="#sec-canasta" data-s="sec-canasta">Canasta 2017/18</a>
  </nav>
</header>

<main id="app">
  <div class="estado">Cargando datos del INDEC…</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script>
(() => {
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const quieto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const BORDO = css('--bordo'), CREMA = css('--crema'), NEGRO = css('--negro'), ROSA = css('--rosa'), HIST = css('--hist');
  const FONT = css('--ui');
  // tintas de los gráficos: papel para lo oficial, negro para la estimación de MECOPOL
  const PAPEL = { fg: NEGRO, fg3: css('--txt-2'), grid: 'rgba(26,10,16,.12)', line: NEGRO };
  const TINTA = { fg: CREMA, fg3: '#c9b7bc', grid: 'rgba(247,239,230,.14)', line: CREMA };
  const nf = (v, d = 1) => v == null ? '—' : v.toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const pct = (v, d = 1, signo = false) => v == null ? '—' : (signo && v > 0 ? '+' : '') + nf(v, d) + '%';
  const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const MESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const etq = ym => { const [a, m] = ym.split('-'); return `${MES[+m - 1]}-${a.slice(2)}`; };
  const largo = ym => { const [a, m] = ym.split('-'); return `${MESL[+m - 1]} de ${a}`; };
  const corto = {
    'Alimentos y bebidas no alcohólicas': 'Alimentos y bebidas', 'Bebidas alcohólicas y tabaco': 'Alcohol y tabaco',
    'Prendas de vestir y calzado': 'Ropa y calzado', 'Vivienda, agua, electricidad, gas y otros combustibles': 'Vivienda y servicios',
    'Equipamiento y mantenimiento del hogar': 'Equipamiento del hogar', 'Bienes y servicios varios': 'Bienes y servicios varios',
  };
  const TIP = { backgroundColor: NEGRO, borderWidth: 0, textStyle: { color: CREMA, fontSize: 13, fontFamily: FONT },
    extraCssText: 'border-radius:0;padding:8px 12px;box-shadow:none;' };

      });
    };
    // acumulada del año en curso, encadenando las variaciones mensuales
    const anio = M.slice(0, 4);
    let acc = 1;
    const ytd = d.serie.filter(x => x.fecha.slice(0, 4) === anio)
      .map(x => { acc *= 1 + x.mensual / 100; return [x.fecha, +((acc - 1) * 100).toFixed(2)]; });
    if (ytd.length) ytd[ytd.length - 1][1] = k.acum_anio;
    spark('sp2', ult.map(x => [x.fecha, x.interanual]), 1);
    spark('sp3', ytd, 1);
    spark('sp4', d.serie.map(x => [x.fecha, x.acumulada]), 0);

    // ---- serie ----
    const xs = d.serie.map(x => x.fecha);
    const elSerie = document.getElementById('ch-serie');
    const ch = nuevo(elSerie, {});
    const dibujar = medida => {
      const ys = d.serie.map(x => x[medida]), dec = medida === 'mensual' ? 2 : 1, ultI = ys.length - 1;
      const barras = medida === 'mensual';
      elSerie.setAttribute('aria-label', `IPC nacional, ${medida}, de ${etq(xs[0])} a ${etq(xs[ultI])}. Último dato: ${pct(ys[ultI], dec)}.`);
      const serie = barras ? {
        type: 'bar', data: ys.map((v, i) => ({ value: v, itemStyle: { color: i === ultI ? BORDO : HIST } })),
        barWidth: '68%',
        label: { show: true, position: 'top', fontFamily: FONT, fontSize: 12, fontWeight: 600, color: NEGRO,
          formatter: p => (p.dataIndex === 0 || p.dataIndex === ultI) ? nf(p.value, 1) : '' },
      } : {
        type: 'line', data: ys, symbol: 'none', lineStyle: { width: 3, color: BORDO },
        markPoint: { symbol: 'rect', symbolSize: 9, itemStyle: { color: BORDO },
          label: { show: true, position: 'top', color: NEGRO, fontFamily: FONT, fontSize: 12, fontWeight: 600, formatter: () => pct(ys[ultI], dec) },
          data: [{ coord: [ultI, ys[ultI]] }] },
      };
      ch.setOption({
        grid: { left: 4, right: 24, top: 28, bottom: 4, containLabel: true },
        tooltip: Object.assign(tip(), barras ? { axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(26,10,16,.07)' } } } : {},
          { formatter: p => `${largo(p[0].name)}<br>${medida[0].toUpperCase() + medida.slice(1)}: <b>${pct(p[0].value, dec)}</b>` }),
        xAxis: ejeX(PAPEL, { type: 'category', data: xs, boundaryGap: barras, axisLabel: { color: PAPEL.fg3, fontFamily: FONT, fontSize: 12, formatter: etq, hideOverlap: true } }),
        yAxis: ejeY(PAPEL, {}),
        series: [serie],
      }, { replaceMerge: ['series', 'xAxis'] });
    };
    dibujar('mensual');
    selector('sel', dibujar);

    // ---- salarios y actividad ----
    if (d.actividad) {
      const A = d.actividad, AS = A.serie, RSM = A.resumen, axs = AS.map(x => x.fecha);
      const CORTES = [['2019-12', 'Dic-19'], ['2023-12', 'Dic-23']];
      const refs = { symbol: 'none', silent: true, animation: false, lineStyle: { color: PAPEL.fg3, type: 'dashed', width: 1 },
        label: { color: PAPEL.fg3, fontFamily: FONT, fontSize: 12, position: 'insideEndTop' },
        data: [...CORTES.filter(([f]) => axs.includes(f)).map(([f, t]) => ({ xAxis: f, label: { formatter: t } })),
          { yAxis: 100, label: { show: false }, lineStyle: { type: 'solid', color: PAPEL.grid, width: 1 } }] };
      const linea = (nombre, clave, color, ancho, conRefs) => Object.assign({
        name: nombre, type: 'line', symbol: 'none', data: AS.map(x => x[clave]), lineStyle: { width: ancho, color },
        endLabel: { show: true, color: PAPEL.fg, fontFamily: FONT, fontSize: 12, fontWeight: 600, formatter: p => nf(p.value, 1) } },
        conRefs ? { markLine: refs } : {});
      const dib = (id, series, etiqueta) => {
        const el = document.getElementById(id);
        el.setAttribute('aria-label', etiqueta);
        nuevo(el, {
          grid: { left: 4, right: 44, top: 20, bottom: 4, containLabel: true },
          tooltip: Object.assign(tip(), { formatter: p => largo(p[0].name) + '<br>' + p.filter(x => x.value != null).map(x =>
            `${x.seriesName}: <b>${nf(x.value, 1)}</b>`).join('<br>') }),
          xAxis: ejeX(PAPEL, { type: 'category', data: axs, boundaryGap: false, axisLabel: { color: PAPEL.fg3, fontFamily: FONT, fontSize: 12, formatter: etq, hideOverlap: true } }),
          yAxis: ejeY(PAPEL, { scale: true, axisLabel: { color: PAPEL.fg3, fontFamily: FONT, fontSize: 12, formatter: v => nf(v, 0) } }),
          series,
        });
      };
      const u = k => RSM[k];
      dib('ch-sal', [linea('Total registrado', 'sal_total', HIST, 2, false), linea('Público', 'sal_publico', NEGRO, 2, false), linea('Privado registrado', 'sal_privado', BORDO, 3, true)],
        `Salario real, base enero de 2019 = 100, hasta ${etq(u('sal_privado').ultimo)}. Privado registrado ${nf(u('sal_privado').valor, 1)}, público ${nf(u('sal_publico').valor, 1)}, total registrado ${nf(u('sal_total').valor, 1)}.`);
      dib('ch-act', [linea('Comercio, promedio de 12 meses', 'comercio', NEGRO, 2, false), linea('Actividad general (EMAE)', 'emae', BORDO, 3, true)],
        `Actividad económica, base enero de 2019 = 100, hasta ${etq(u('emae').ultimo)}. Actividad general ${nf(u('emae').valor, 1)}, comercio ${nf(u('comercio').valor, 1)}.`);
      const vs = v => v == null ? '—' : Math.abs(v) < 0.05 ? 'igual' : `${nf(Math.abs(v), 1)}% ${v < 0 ? 'por debajo' : 'por encima'}`;
      const f = (k, x) => ({ base: x[k].valor - 100, ini: x[k].vs_inicio_gobierno });
      const sp = f('sal_privado', RSM), sb = f('sal_publico', RSM), ea = f('emae', RSM), co = f('comercio', RSM);
      document.getElementById('lec-act').innerHTML =
        `En <b>${etq(u('sal_privado').ultimo)}</b>, el salario real del sector privado registrado está <b>${vs(sp.base)}</b> de enero de 2019 y <b>${vs(sp.ini)}</b> de nov-23; el del sector público, <b>${vs(sb.base)}</b> y <b>${vs(sb.ini)}</b>. ` +
        `La actividad general está <b>${vs(ea.base)}</b> de enero de 2019 y <b>${vs(ea.ini)}</b> de nov-23; el comercio, <b>${vs(co.base)}</b> y <b>${vs(co.ini)}</b>.`;
      document.getElementById('nota-act').textContent =
        'Salario real: índice de salarios del INDEC dividido por el IPC nacional. Llega hasta ' + largo(u('sal_privado').ultimo) +
        ', un mes antes que el IPC. No incluye el sector no registrado, que el INDEC mide con otra fuente y con rezago. ' +
        'Actividad: EMAE desestacionalizado. El INDEC no publica el comercio desestacionalizado, así que se muestra el promedio de 12 meses de su serie original, que va más atrasado que el dato del mes. ' +
        'Las líneas punteadas marcan los cambios de gobierno (dic-19 y dic-23).';
    }

    // ---- canasta de hoy ----
    if (d.reponderado) {
      const RS = d.reponderado.serie, elRep = document.getElementById('ch-rep'), chR = nuevo(elRep, {});
      const dibR = med => {
        const dec = 1, u = RS[RS.length - 1];   // la serie de la canasta viene con un decimal
        elRep.setAttribute('aria-label', `Inflación ${med}, IPC oficial y canasta 2017/18. Último dato: oficial ${pct(u.oficial[med], dec)}, canasta 2017/18 ${pct(u.reponderado[med], dec)}.`);
        chR.setOption({
          grid: { left: 4, right: 60, top: 24, bottom: 4, containLabel: true },
          tooltip: Object.assign(tip(TINTA), { formatter: p => `${largo(p[0].name)}<br>` + p.map(x =>
            `${x.seriesName}: <b>${pct(x.value, dec)}</b>`).join('<br>') }),
          xAxis: ejeX(TINTA, { type: 'category', data: RS.map(x => x.fecha), boundaryGap: false, axisLabel: { color: TINTA.fg3, fontFamily: FONT, fontSize: 12, formatter: etq, hideOverlap: true } }),
          yAxis: ejeY(TINTA, {}),
          series: [
            { name: 'IPC oficial', type: 'line', symbol: 'none', data: RS.map(x => x.oficial[med]), lineStyle: { width: 2, color: CREMA } },
            { name: 'Canasta 2017/18', type: 'line', symbol: 'none', data: RS.map(x => x.reponderado[med]), lineStyle: { width: 3, color: ROSA },
              endLabel: { show: true, color: CREMA, fontFamily: FONT, fontSize: 12, fontWeight: 600, formatter: p => pct(p.value, dec) } },
          ],
        }, { replaceMerge: ['series'] });
      };
      dibR('acumulada');
      selector('sel-rep', dibR);
    }

    // ---- regiones ----
    if (d.regiones) {
      const RG = d.regiones.regiones;
      const ordRub = [...d.rubros].sort((a, b) => b.acum_gobierno - a.acum_gobierno).map(r => r.rubro);
      const nacRub = Object.fromEntries(d.rubros.map(r => [r.rubro, r]));
      const nacGen = { mensual: KR.mensual, interanual: KR.interanual, acum_gobierno: KR.acum_gobierno };
      const calor = (med, dec) => {
        const tb = document.getElementById('tb-calor'); if (!tb) return;
        tb.innerHTML = ordRub.map(rub => {
          const vals = RG.map(r => r.rubros && r.rubros[rub] ? r.rubros[rub][med] : null);
          const ok = vals.filter(v => v != null), mn = Math.min(...ok), mx = Math.max(...ok);
          // la máxima de la fila va en bordó lleno; el resto, en cuatro tintas donde el texto negro se sigue leyendo
          const cel = v => { if (v == null) return '<td class="cel">—</td>';
            if (v === mx && mx > mn) return `<td class="cel max">${pct(v, dec)}</td>`;
            const t = mx > mn ? (v - mn) / (mx - mn) : 0.5, a = [0.08, 0.24, 0.4, 0.56][Math.min(3, Math.floor(t * 4))];
            return `<td class="cel" style="background:rgba(149,11,50,${a})">${pct(v, dec)}</td>`; };
          const n = nacRub[rub] ? nacRub[rub][med] : null;
          return `<tr><td>${corto[rub] || rub}</td><td class="nac">${pct(n, dec)}</td>${vals.map(cel).join('')}</tr>`;
        }).join('');
      };
      const centro = { GBA: [-53.6, -35.4] };   // etiqueta de GBA, en el mar, con una línea al AMBA
      fetch('geo/regiones_ipc.json').then(r => r.json()).then(geo => {
        echarts.registerMap('regiones', geo);
        const pos = Object.fromEntries(geo.features.map(f => [f.properties.name, [f.properties.cx, f.properties.cy]]));
        pos.Patagonia = [-68.5, -44.5]; pos.Pampeana = [-61.6, -35.6]; pos.Cuyo = [-68.6, -32.6];
        const elMapa = document.getElementById('ch-mapa');
        const ch = nuevo(elMapa, {});
        const esChico = () => elMapa.clientWidth < 480;
        let medActual = 'mensual', chicoActual = esChico();
        const dibujar = med => {
          medActual = med; chicoActual = esChico();
          const dec = med === 'mensual' ? dM : med === 'interanual' ? 1 : 0, vals = RG.map(r => r[med]);
          const mn = Math.min(...vals), mx = Math.max(...vals);
          const ordenadas = [...RG].sort((a, b) => b[med] - a[med]);
          document.getElementById('tb-reg').innerHTML = ordenadas.map(r =>
            `<tr><td>${r.region}</td><td>${pct(r.mensual, dM)}</td><td>${pct(r.interanual, 1)}</td><td>${pct(r.acum_gobierno, 0)}</td></tr>`).join('') +
            `<tr class="nac"><td>Nacional</td><td>${pct(nacGen.mensual, dM)}</td><td>${pct(nacGen.interanual, 1)}</td><td>${pct(nacGen.acum_gobierno, 0)}</td></tr>`;
          const alto = ordenadas[0], bajo = ordenadas[ordenadas.length - 1];
          const queMide = med === 'mensual' ? `En ${mesL(MR)}` : med === 'interanual' ? 'En los últimos doce meses' : 'Desde noviembre de 2023';
          const masSubio = r => { const e = Object.entries(r.rubros || {}).sort((a, b) => b[1][med] - a[1][med])[0]; return e ? ` (lo que más subió: ${(corto[e[0]] || e[0]).toLowerCase()}, ${pct(e[1][med], dec)})` : ''; };
          document.getElementById('lectura-reg').innerHTML = `${queMide}, la inflación más alta fue la de <b>${alto.region}</b>, con <b>${pct(alto[med], dec)}</b>${masSubio(alto)}, y la más baja la de <b>${bajo.region}</b>, con <b>${pct(bajo[med], dec)}</b>. La diferencia entre las dos es de ${nf(alto[med] - bajo[med], dec === 2 ? 2 : 1)} puntos.`;
          calor(med, dec);
          ch.setOption({
            tooltip: Object.assign({}, TIP, { trigger: 'item',
              formatter: p => { const r = RG.find(x => x.region === p.name); if (!r) return '';
                return `<b>${r.region}</b><br>${etq(MR)}: <b>${pct(r.mensual, dM)}</b> · interanual ${pct(r.interanual, 1)}<br>Desde nov-23: ${pct(r.acum_gobierno, 0)}`; } }),
            visualMap: { type: 'piecewise', splitNumber: 4, min: mn, max: mx === mn ? mn + 0.01 : mx, selectedMode: false, showLabel: false, itemSymbol: 'rect', orient: 'horizontal', left: 8, bottom: 8, itemWidth: 28, itemHeight: 10, itemGap: 0,
              text: [`\u00a0\u00a0${pct(mx, dec)}`, `${pct(mn, dec)}\u00a0\u00a0`], textStyle: { color: NEGRO, fontFamily: FONT, fontSize: 12 },
              inRange: { color: ['#f4c9d6', '#e77f9f', '#c02a57', '#6d0623'] }, seriesIndex: 0 },
            geo: { map: 'regiones', roam: false, aspectScale: 0.82, layoutCenter: ['50%', chicoActual ? '48%' : '46%'], layoutSize: chicoActual ? '130%' : '92%',
              itemStyle: { areaColor: '#eadfd3', borderColor: CREMA, borderWidth: 1.5 }, emphasis: { disabled: true }, silent: true },
            series: [
              { type: 'map', geoIndex: 0, data: RG.map(r => ({ name: r.region, value: r[med] })) },
              { type: 'lines', coordinateSystem: 'geo', silent: true, symbol: 'none', lineStyle: { color: NEGRO, width: 1 },
                data: [{ coords: [[-58.45, -34.62], [centro.GBA[0] - 0.6, centro.GBA[1] + 0.3]] }] },
              { type: 'scatter', coordinateSystem: 'geo', symbolSize: 0, silent: true, itemStyle: { opacity: 1 },
                data: RG.map(r => ({ name: r.region, value: [...(centro[r.region] || pos[r.region]), r[med]] })),
                label: { show: true, formatter: p => `{n|${p.name}}
{v|${pct(p.value[2], dec)}}`, align: 'center',
                  // etiqueta plana de papel: se lee igual sobre cualquier tinta del mapa y sobre el fondo
                  backgroundColor: CREMA, borderColor: NEGRO, borderWidth: 1, padding: [3, 5, 2],
                  rich: { n: { fontSize: chicoActual ? 11 : 12, fontFamily: FONT, fontWeight: 600, lineHeight: 14, color: NEGRO },
                          v: { fontSize: chicoActual ? 13 : 14, fontFamily: FONT, fontWeight: 800, lineHeight: 17, color: NEGRO } } } },
            ],
          }, { replaceMerge: ['series'] });
        };
        dibujar('mensual');
        selector('sel-reg', dibujar);
        // al girar el teléfono o cambiar de ancho, el mapa recalcula tamaño y etiquetas
        new ResizeObserver(() => { if (esChico() !== chicoActual) dibujar(medActual); }).observe(elMapa);
      }).catch(err => { document.getElementById('ch-mapa').textContent = 'No se pudo cargar el mapa.'; console.error(err); });
    }

    // ---- rubros ----
    const rs = [...d.rubros].sort((a, b) => b.relativo - a.relativo);
    const maxRel = Math.max(...rs.map(r => Math.abs(r.relativo)));
    document.getElementById('tb-rubros').innerHTML = rs.map(r => {
      const w = (Math.abs(r.relativo) / maxRel * 100).toFixed(1);
      const barra = r.relativo >= 0
        ? `<div class="izq"></div><div class="der"><b class="pista"><i style="width:${w}%"></i></b><span>${pct(r.relativo, 1, true)}</span></div>`
        : `<div class="izq"><span>${pct(r.relativo, 1, true)}</span><b class="pista"><i style="width:${w}%"></i></b></div><div class="der"></div>`;
      return `<tr><td>${corto[r.rubro] || r.rubro}</td><td class="rel"><div class="div">${barra}</div></td>` +
        `<td>${pct(r.mensual, 1)}</td><td>${pct(r.interanual, 1)}</td><td>${pct(r.acum_gobierno, 0)}</td></tr>`;
    }).join('');

  }

  function shift(ym, n) { const [a, m] = ym.split('-').map(Number); const t = a * 12 + (m - 1) + n; return `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, '0')}`; }

  fetch('data/dashboard.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(e => {
      document.getElementById('app').innerHTML = '<div class="estado">No se pudieron cargar los datos (data/dashboard.json). Revisá que la Action haya corrido al menos una vez.</div>';
      console.error(e);
    });
})();
</script>
</body>
</html>
