<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero de Precios MECOPOL</title>
<meta name="description" content="Inflación, precios relativos y comparación entre gobiernos con datos del INDEC. Mesa de Economía Política UNLa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: grilla de paneles estilo consola de monitoreo; 12 columnas que bajan a 1 en celular.
   Tema oscuro único, elegido a propósito (pedido: "corte Grafana"). */
:root {
  color-scheme: dark;
  --bg:        #0e1014;
  --panel:     #15181e;
  --panel-hi:  #1b1f26;
  --line:      #262a33;
  --grid:      #20242c;
  --fg:        #dfe2e8;
  --fg-2:      #a3a9b6;
  --fg-3:      #727a89;
  --accent:    #e8eaef;
  --good:      #3fb27f;
  --warn:      #e0a33a;
  --bad:       #e5534b;
  --font-ui:   "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-num:  "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 4px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 var(--font-ui);
  font-stretch: 100%;
  padding-inline: 16px;
  padding-block: 0 32px;
}
a { color: var(--fg); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- barra superior ---- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  margin-inline: -16px; padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b {
  font-stretch: 75%; font-weight: 700; font-size: 15px;
  letter-spacing: .08em; text-transform: uppercase;
}
.brand span { color: var(--fg-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--fg-3); font: 12px var(--font-num); }
.meta strong { color: var(--fg-2); font-weight: 500; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; }

.aviso {
  margin-top: 14px; padding: 8px 12px; border: 1px solid #5c4a1c; border-radius: var(--r);
  background: #221d10; color: #e9cf8f; font-size: 13px;
}

/* ---- grilla ---- */
.grid {
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 10px; margin-top: 14px; max-width: 1600px; margin-inline: auto;
}
.fila-titulo {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 10px;
  margin-top: 10px; color: var(--fg-2); font-size: 12px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; font-stretch: 85%;
}
.fila-titulo::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  display: flex; flex-direction: column; min-width: 0;
}
.panel header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
  padding: 10px 12px 0;
}
.panel h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--fg); text-wrap: balance; }
.panel .sub { width: 100%; margin: 2px 0 0; color: var(--fg-3); font-size: 12px; max-width: 75ch; }
.panel .cuerpo { padding: 8px 12px 12px; flex: 1; min-width: 0; }
.chart { width: 100%; height: 320px; }
.chart.alto { height: 400px; }

.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; }
.s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; }
.s12 { grid-column: span 12; }
@media (max-width: 1100px) {
  .s3 { grid-column: span 6; } .s4, .s5, .s7, .s8 { grid-column: span 12; } .s6 { grid-column: span 12; }
}
@media (max-width: 560px) {
  .s3 { grid-column: span 12; }
  .chart { height: 280px; } .chart.alto { height: 460px; }
}

/* ---- paneles de número ---- */
.stat .cuerpo { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.stat .valor {
  font: 600 38px/1.1 var(--font-num); letter-spacing: -.02em; color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.stat .valor small { font-size: 20px; color: var(--fg-2); margin-left: 2px; }
.stat .pie { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--fg-3); font-size: 12px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 3px;
  font: 500 12px var(--font-num); border: 1px solid currentColor;
}
.chip.baja { color: var(--good); } .chip.sube { color: var(--warn); } .chip.igual { color: var(--fg-2); }
.spark { width: 100%; height: 44px; margin-top: 4px; }

/* ---- controles ---- */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin-left: auto; }
.seg button {
  font: 500 12px var(--font-ui); color: var(--fg-2); background: transparent; border: 0;
  padding: 4px 10px; cursor: pointer;
}
.seg + .seg { margin-left: 0; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--panel-hi); color: var(--fg); }
.seg button:hover { color: var(--fg); }

/* ---- tablas ---- */
.tabla-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--fg-3); font-weight: 500; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
th:first-child, td:first-child { text-align: left; }
td { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--fg); }
td:first-child { font-family: var(--font-ui); }
tr:last-child td { border-bottom: 0; }
.gob { display: inline-flex; align-items: center; gap: 8px; }
.gob i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.barra { position: relative; }
.barra span { position: relative; z-index: 1; }
.barra::before {
  content: ""; position: absolute; right: 8px; top: 50%; height: 14px; transform: translateY(-50%);
  width: var(--w, 0%); max-width: calc(100% - 16px); background: var(--c, #444); opacity: .22; border-radius: 2px;
}
.nota { color: var(--fg-3); font-size: 12px; margin: 8px 0 0; }

/* ---- metodología ---- */
.metodo { grid-column: 1 / -1; }
.metodo .cuerpo { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 28px; }
.metodo h3 { margin: 0 0 4px; font-size: 13px; color: var(--fg); }
.metodo p { margin: 0; color: var(--fg-2); font-size: 13px; max-width: 65ch; }
code { font-family: var(--font-num); font-size: 12px; color: var(--fg-2); background: var(--panel-hi); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }

.estado { grid-column: 1 / -1; padding: 40px 16px; text-align: center; color: var(--fg-2); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="top">
  <div class="brand"><b>MECOPOL</b><span>Tablero de precios · Mesa de Economía Política UNLa</span></div>
  <div class="meta" id="meta"><span><span class="dot"></span>cargando datos…</span></div>
</div>

<div id="aviso" class="aviso" hidden></div>

<main class="grid" id="grid">
  <div class="estado" id="estado">Cargando datos del INDEC…</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script>
(() => {
  // ---------- utilidades ----------
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const T = {
    fg: css('--fg'), fg2: css('--fg-2'), fg3: css('--fg-3'), grid: css('--grid'), line: css('--line'),
    panel: css('--panel'), accent: css('--accent'), num: css('--font-num'), ui: css('--font-ui'),
  };
  const nf = (v, d = 1) => v == null ? '—' :
    v.toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const pct = (v, d = 1, signo = false) => v == null ? '—' : (signo && v > 0 ? '+' : '') + nf(v, d) + '%';
  const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const etq = ym => { const [a, m] = ym.split('-'); return `${MES[+m - 1]}-${a.slice(2)}`; };
  const corto = {
    'Alimentos y bebidas no alcohólicas': 'Alimentos y bebidas',
    'Bebidas alcohólicas y tabaco': 'Alcohol y tabaco',
    'Prendas de vestir y calzado': 'Ropa y calzado',
    'Vivienda, agua, electricidad, gas y otros combustibles': 'Vivienda y servicios',
    'Equipamiento y mantenimiento del hogar': 'Equipamiento del hogar',
    'Salud': 'Salud', 'Transporte': 'Transporte', 'Comunicación': 'Comunicación',
    'Recreación y cultura': 'Recreación y cultura', 'Educación': 'Educación',
    'Restaurantes y hoteles': 'Restaurantes y hoteles', 'Bienes y servicios varios': 'Bienes y serv. varios',
  };
  const graficos = [];
  const nuevo = (el, opt) => {
    const c = echarts.init(el, null, { renderer: 'canvas' });
    c.setOption(Object.assign(base(), opt));
    graficos.push(c);
    new ResizeObserver(() => c.resize()).observe(el);
    return c;
  };
  const base = () => ({
    backgroundColor: 'transparent',
    textStyle: { fontFamily: T.ui, color: T.fg2 },
    animationDuration: 500,
    grid: { left: 8, right: 16, top: 28, bottom: 8, containLabel: true },
    tooltip: {
      trigger: 'axis', backgroundColor: '#1d2129', borderColor: T.line, borderWidth: 1,
      textStyle: { color: T.fg, fontSize: 12, fontFamily: T.ui }, extraCssText: 'border-radius:4px;',
      axisPointer: { type: 'line', lineStyle: { color: T.fg3, width: 1 } },
    },
  });
  const ejeX = extra => Object.assign({
    axisLine: { lineStyle: { color: T.line } }, axisTick: { show: false },
    axisLabel: { color: T.fg3, fontFamily: T.num, fontSize: 11 }, splitLine: { show: false },
  }, extra);
  const ejeY = extra => Object.assign({
    type: 'value', axisLine: { show: false }, axisTick: { show: false },
    axisLabel: { color: T.fg3, fontFamily: T.num, fontSize: 11, formatter: v => nf(v, 0) + '%' },
    splitLine: { lineStyle: { color: T.grid, width: 1 } },
  }, extra);
  const marca = color => `<i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${color};margin-right:6px"></i>`;

  // ---------- armado ----------
  function panel({ cls, titulo, sub, controles = '', cuerpo }) {
    return `<section class="panel ${cls}"><header><h2>${titulo}</h2>${controles}${sub ? `<p class="sub">${sub}</p>` : ''}</header><div class="cuerpo">${cuerpo}</div></section>`;
  }
  const seg = (id, ops, activo) => `<div class="seg" role="group" id="${id}">${ops.map(([v, t]) =>
    `<button type="button" data-v="${v}" aria-pressed="${v === activo}">${t}</button>`).join('')}</div>`;

  function render(d) {
    const G = d.gobiernos, K = d.mes_gobierno, k = d.kpis, M = etq(d.ultimo_mes);
    const col = g => G[g].color;
    const act = new Date(d.actualizado);
    document.getElementById('meta').innerHTML =
      `<span><span class="dot"></span>Último dato <strong>${M}</strong></span>` +
      `<span>Mes <strong>${K}</strong> de gobierno</span>` +
      `<span>Actualizado <strong>${act.toLocaleDateString('es-AR', { day: '2-digit', month: 'short' })} ${act.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })}</strong></span>`;
    if (d.simulado) {
      const a = document.getElementById('aviso'); a.hidden = false;
      a.textContent = 'Vista previa con datos de prueba. El nivel general y los rubros desde nov-23 salen de la planilla del equipo; el período anterior es ilustrativo. En GitHub Pages se reemplaza solo por los datos reales del INDEC.';
    }

    const chip = (actual, previo) => {
      if (actual == null || previo == null) return '';
      const dif = actual - previo, cls = Math.abs(dif) < 0.05 ? 'igual' : dif < 0 ? 'baja' : 'sube';
      const fl = cls === 'baja' ? '▼' : cls === 'sube' ? '▲' : '■';
      return `<span class="chip ${cls}" title="${cls === 'baja' ? 'Bajó' : cls === 'sube' ? 'Subió' : 'Sin cambios'} respecto del mes anterior">${fl} ${nf(Math.abs(dif), 1)} pp</span>`;
    };
    const stat = (titulo, valor, pie, spark = '') => panel({
      cls: 's3 stat', titulo,
      cuerpo: `<div class="valor">${valor}</div><div class="pie">${pie}</div>${spark}`,
    });
    const num = (v, d) => v == null ? '—' : `${nf(v, d)}<small>%</small>`;
    const milei0 = G.Milei.base;

    const grid = document.getElementById('grid');
    grid.innerHTML = [
      `<div class="fila-titulo">Inflación de ${M}</div>`,
      stat('Inflación mensual', num(k.mensual, 2),
        `${chip(k.mensual, k.mensual_previo)}<span>mes anterior ${pct(k.mensual_previo, 2)}</span>`,
        '<div class="spark" id="sp-mensual" role="img" aria-label="Inflación mensual de los últimos 12 meses"></div>'),
      stat('Interanual', num(k.interanual, 1),
        `${chip(k.interanual, k.interanual_previo)}<span>vs. ${etq(shift(d.ultimo_mes, -12))}</span>`,
        '<div class="spark" id="sp-interanual" role="img" aria-label="Inflación interanual de los últimos 12 meses"></div>'),
      stat(`Acumulada ${d.ultimo_mes.slice(0, 4)}`, num(k.acum_anio, 1),
        `<span>desde dic-${String(+d.ultimo_mes.slice(0, 4) - 1).slice(2)}</span>`),
      stat('Acumulada del gobierno', num(k.acum_gobierno, 1),
        `<span>desde ${milei0} · ${K} meses</span>`),

      `<div class="fila-titulo">Serie histórica</div>`,
      panel({
        cls: 's12', titulo: 'Inflación nacional',
        controles: seg('sel-medida', [['mensual', 'Mensual'], ['interanual', 'Interanual']], 'mensual') +
                   seg('sel-rango', [['todo', 'Desde 2017'], ['gob', 'Este gobierno'], ['12', '12 meses']], 'todo'),
        sub: 'IPC nacional del INDEC. Las franjas marcan cada gobierno.',
        cuerpo: '<div class="chart" id="ch-serie"></div>',
      }),

      `<div class="fila-titulo">Gobierno vs. gobierno</div>`,
      panel({
        cls: 's7', titulo: 'Inflación acumulada por mes de gobierno',
        sub: 'Cada línea arranca en 0 en el último mes del gobierno anterior (noviembre del año de asunción).',
        cuerpo: '<div class="chart" id="ch-tray"></div>',
      }),
      panel({
        cls: 's5', titulo: `A la misma altura: mes ${K}`,
        sub: 'Promedio mensual: la tasa constante que daría la misma acumulada.',
        cuerpo: `<div class="tabla-wrap"><table id="tb-altura"></table></div>`,
      }),

      `<div class="fila-titulo">Rubros y precios relativos</div>`,
      panel({
        cls: 's6', titulo: `Precios relativos al mes ${K}`,
        sub: 'Cuánto subió cada rubro frente al nivel general desde el inicio del gobierno. Positivo: se encareció más que el promedio.',
        cuerpo: '<div class="chart alto" id="ch-rel"></div>',
      }),
      panel({
        cls: 's6', titulo: `Inflación de ${M} por rubro`,
        sub: 'Variación mensual de cada división del IPC. La línea marca el nivel general.',
        cuerpo: '<div class="chart alto" id="ch-rubros"></div>',
      }),

      `<div class="fila-titulo">Escenarios al fin del mandato</div>`,
      panel({
        cls: 's7', titulo: '¿Cómo termina el mandato?',
        sub: `Trayectoria real y cuatro escenarios hasta el mes ${d.fin_mandato} (nov-27). Son supuestos, no pronósticos. Consenso REM: relevamiento del BCRA de ${etq(d.escenarios.rem_publicado)}.`,
        cuerpo: '<div class="chart" id="ch-esc"></div>',
      }),
      panel({
        cls: 's5', titulo: 'Cierre de cada mandato',
        sub: 'Acumulada en los 48 meses e inflación interanual con la que se entrega el gobierno.',
        cuerpo: `<div class="tabla-wrap"><table id="tb-cierre"></table></div>
          <p class="nota">Milei acumuló ${pct(d.milei_tramos.primeros_5, 0)} en sus primeros 5 meses y ${pct(d.milei_tramos.resto, 0)} en los ${d.milei_tramos.meses_resto} siguientes.</p>`,
      }),

      panel({
        cls: 'metodo', titulo: 'Cómo leer este tablero',
        cuerpo: `
          <div><h3>Fuente</h3><p>IPC Nacional del INDEC, base diciembre 2016 = 100, vía la API de Series de Tiempo de datos.gob.ar. Se actualiza solo todos los días; el INDEC publica cada mes a mediados del mes siguiente.</p></div>
          <div><h3>Mes base</h3><p>Todos los gobiernos asumieron un 10 de diciembre, así que se toma noviembre como último mes del gobierno anterior. Para Milei eso incluye diciembre de 2023 (25,5% mensual, mes de la devaluación). Es la convención más usada y es discutible.</p></div>
          <div><h3>Macri</h3><p>Entre diciembre de 2015 y diciembre de 2016 el INDEC no publicó IPC nacional. Macri aparece solo cuando se carga el empalme con el IPC CABA en la configuración, y conviene aclararlo al citar el dato.</p></div>
          <div><h3>Antes de concluir</h3><p>La inflación sola no define qué gobierno fue mejor. Pesan la inflación heredada, la dirección en que iba, los shocks de cada período (sequías, pandemia, crisis cambiarias) y lo que pasó con salarios, empleo y actividad.</p></div>
          <div><h3>Series usadas</h3><p>Nivel general: <code>${d.fuentes.nivel_general}</code> y ${Object.keys(d.fuentes.divisiones).length} divisiones nacionales.</p></div>`,
      }),
    ].join('');

    // ---------- sparklines ----------
    const ult = d.serie_mensual.slice(-12);
    const spark = (id, campo, dec) => nuevo(document.getElementById(id), {
      grid: { left: 0, right: 0, top: 4, bottom: 2 },
      tooltip: { trigger: 'axis', formatter: p => `${etq(p[0].name)}: <b>${pct(p[0].value, dec)}</b>`, axisPointer: { type: 'none' },
        backgroundColor: '#1d2129', borderColor: T.line, textStyle: { color: T.fg, fontSize: 12 } },
      xAxis: { type: 'category', data: ult.map(x => x.fecha), show: false, boundaryGap: false },
      yAxis: { type: 'value', show: false, scale: true },
      series: [{
        type: 'line', data: ult.map(x => x[campo]), smooth: false, symbol: 'none',
        lineStyle: { width: 2, color: T.fg2 },
        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(163,169,182,.25)' }, { offset: 1, color: 'rgba(163,169,182,0)' }]) },
        markPoint: { symbol: 'circle', symbolSize: 7, itemStyle: { color: T.accent }, label: { show: false },
          data: [{ coord: [ult.length - 1, ult[ult.length - 1][campo]] }] },
      }],
    });
    spark('sp-mensual', 'mensual', 2);
    spark('sp-interanual', 'interanual', 1);

    // ---------- serie histórica ----------
    const fechas = d.serie_mensual.map(x => x.fecha);
    const periodos = Object.entries(G).map(([g, v]) => {
      const ini = baseYM(v.base, 1), fin = baseYM(v.base, d.fin_mandato);
      const a = fechas.find(f => f >= ini), b = [...fechas].reverse().find(f => f <= fin);
      return a && b && a <= b ? [{ name: g, xAxis: a, itemStyle: { color: hexA(col(g), .10) },
        label: { color: col(g), fontFamily: T.ui, fontWeight: 600, fontSize: 11, position: 'insideTopLeft' } }, { xAxis: b }] : null;
    }).filter(Boolean);
    let medida = 'mensual', rango = 'todo';
    const chSerie = nuevo(document.getElementById('ch-serie'), {});
    const dibujarSerie = () => {
      const desde = rango === 'todo' ? 0 : rango === '12' ? fechas.length - 12 : fechas.findIndex(f => f >= baseYM(G.Milei.base, 1));
      const xs = fechas.slice(desde), ys = d.serie_mensual.slice(desde).map(x => x[medida]);
      chSerie.setOption({
        grid: { left: 8, right: 34, top: 28, bottom: 8, containLabel: true },
        xAxis: ejeX({ type: 'category', data: xs, boundaryGap: false,
          axisLabel: { color: T.fg3, fontFamily: T.num, fontSize: 11, formatter: etq, hideOverlap: true } }),
        yAxis: ejeY({}),
        tooltip: Object.assign(base().tooltip, { formatter: p => `${etq(p[0].name)}<br>${medida === 'mensual' ? 'Mensual' : 'Interanual'}: <b>${pct(p[0].value, medida === 'mensual' ? 2 : 1)}</b>` }),
        series: [{
          name: medida, type: 'line', data: ys, symbol: 'none', lineStyle: { width: 2, color: T.accent },
          areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(232,234,239,.16)' }, { offset: 1, color: 'rgba(232,234,239,0)' }]) },
          markArea: { silent: true, data: periodos.filter(([a, b]) => b.xAxis >= xs[0]).map(([a, b]) => [Object.assign({}, a, { xAxis: a.xAxis < xs[0] ? xs[0] : a.xAxis }), b]) },
          markPoint: { symbol: 'circle', symbolSize: 8, itemStyle: { color: T.accent, borderColor: T.panel, borderWidth: 2 },
            label: { show: true, position: 'top', color: T.fg, fontFamily: T.num, fontSize: 11, formatter: () => pct(ys[ys.length - 1], medida === 'mensual' ? 2 : 1) },
            data: [{ coord: [xs.length - 1, ys[ys.length - 1]] }] },
        }],
      }, { replaceMerge: ['series', 'xAxis'] });
    };
    dibujarSerie();
    seguir('sel-medida', v => { medida = v; dibujarSerie(); });
    seguir('sel-rango', v => { rango = v; dibujarSerie(); });

    // ---------- trayectorias ----------
    const gobs = Object.keys(d.trayectorias);
    nuevo(document.getElementById('ch-tray'), {
      grid: { left: 8, right: 125, top: 28, bottom: 28, containLabel: true },
      legend: { top: 0, left: 0, textStyle: { color: T.fg2 }, itemWidth: 14, itemHeight: 3, icon: 'rect' },
      xAxis: ejeX({ type: 'value', min: 0, max: d.fin_mandato, interval: 12, name: 'meses de gobierno', nameLocation: 'middle', nameGap: 24,
        nameTextStyle: { color: T.fg3, fontSize: 11 }, axisLabel: { color: T.fg3, fontFamily: T.num, fontSize: 11 } }),
      yAxis: ejeY({}),
      tooltip: Object.assign(base().tooltip, { formatter: p => `Mes ${p[0].value[0]}<br>` +
        p.map(s => `${marca(s.color)}${s.seriesName}: <b>${pct(s.value[1], 1)}</b>`).join('<br>') }),
      series: gobs.map(g => {
        const datos = d.trayectorias[g].map((v, i) => [i, v]).filter(p => p[1] != null);
        return {
          name: g, type: 'line', data: datos, symbol: 'none', lineStyle: { width: 2, color: col(g) }, itemStyle: { color: col(g) },
          endLabel: { show: true, color: T.fg, fontFamily: T.num, fontSize: 11, formatter: p => `${g} ${pct(p.value[1], 0)}` },
          markLine: g === 'Milei' ? { silent: true, symbol: 'none', lineStyle: { color: T.fg3, type: 'solid', width: 1 },
            label: { color: T.fg3, fontSize: 11, formatter: `hoy · mes ${K}`, position: 'insideEndTop' }, data: [{ xAxis: K }] } : undefined,
        };
      }),
    });

    const ma = d.misma_altura;
    document.getElementById('tb-altura').innerHTML =
      `<thead><tr><th>Gobierno</th><th>Mes</th><th>Acumulada</th><th>Prom. mensual</th><th>Heredada</th><th>Interanual</th></tr></thead><tbody>` +
      ma.map(r => `<tr><td><span class="gob"><i style="background:${col(r.gobierno)}"></i>${r.gobierno}</span></td><td>${r.mes}</td>` +
        `<td>${pct(r.acumulada, 1)}</td><td>${pct(r.promedio_mensual, 2)}</td><td>${pct(r.interanual_al_asumir, 1)}</td><td>${pct(r.interanual_misma_altura, 1)}</td></tr>`).join('') +
      `</tbody>`;

    // ---------- precios relativos ----------
    const pr = d.precios_relativos;
    const orden = pr.rubros.map((r, i) => i).sort((a, b) => pr.Milei[a] - pr.Milei[b]);
    const relGobs = ['Fernández', 'Milei'].filter(g => pr[g]);
    nuevo(document.getElementById('ch-rel'), {
      grid: { left: 8, right: 24, top: 30, bottom: 8, containLabel: true },
      legend: { top: 0, left: 0, textStyle: { color: T.fg2 }, itemWidth: 10, itemHeight: 10 },
      tooltip: Object.assign(base().tooltip, { axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(255,255,255,.04)' } },
        formatter: p => `${pr.rubros[orden[p[0].dataIndex]]}<br>` + p.map(s => `${marca(s.color)}${s.seriesName}: <b>${pct(s.value, 1, true)}</b>`).join('<br>') }),
      xAxis: ejeY({ axisLabel: { color: T.fg3, fontFamily: T.num, fontSize: 11, formatter: v => (v > 0 ? '+' : '') + nf(v, 0) + '%' } }),
      yAxis: ejeX({ type: 'category', data: orden.map(i => corto[pr.rubros[i]] || pr.rubros[i]),
        axisLabel: { color: T.fg2, fontSize: 11, fontFamily: T.ui }, axisLine: { show: false } }),
      series: relGobs.map(g => ({
        name: g, type: 'bar', data: orden.map(i => pr[g][i]), barWidth: 7, barGap: '30%',
        itemStyle: { color: col(g), borderRadius: 2 },
        markLine: g === 'Milei' ? { silent: true, symbol: 'none', label: { show: false }, lineStyle: { color: T.fg3, type: 'solid', width: 1 }, data: [{ xAxis: 0 }] } : undefined,
      })),
    });

    // ---------- rubros del mes ----------
    const rm = [...d.rubros_mes].sort((a, b) => a.mensual - b.mensual);
    nuevo(document.getElementById('ch-rubros'), {
      grid: { left: 8, right: 40, top: 30, bottom: 8, containLabel: true },
      tooltip: Object.assign(base().tooltip, { axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(255,255,255,.04)' } },
        formatter: p => `${rm[p[0].dataIndex].rubro}<br>Mensual: <b>${pct(rm[p[0].dataIndex].mensual, 2)}</b><br>Interanual: ${pct(rm[p[0].dataIndex].interanual, 1)}` }),
      xAxis: ejeY({ axisLabel: { color: T.fg3, fontFamily: T.num, fontSize: 11, formatter: v => nf(v, 1) + '%' } }),
      yAxis: ejeX({ type: 'category', data: rm.map(r => corto[r.rubro] || r.rubro),
        axisLabel: { color: T.fg2, fontSize: 11, fontFamily: T.ui }, axisLine: { show: false } }),
      series: [{
        type: 'bar', data: rm.map(r => r.mensual), barWidth: 12,
        itemStyle: { color: '#7d8494', borderRadius: 2 },
        emphasis: { itemStyle: { color: T.accent } },
        label: { show: true, position: 'right', color: T.fg2, fontFamily: T.num, fontSize: 11, formatter: p => nf(p.value, 1) },
        markLine: { silent: true, symbol: 'none', lineStyle: { color: T.accent, type: 'solid', width: 1 },
          label: { color: T.fg, fontSize: 11, fontFamily: T.num, position: 'end', formatter: `General ${pct(k.mensual, 2)}` },
          data: [{ xAxis: k.mensual }] },
      }],
    });

    // ---------- escenarios ----------
    const esc = d.escenarios, desde = esc.desde_mes;
    const estilos = [[0, 'dotted'], [1, 'solid'], [2, 'dashed'], [3, [8, 4, 2, 4]]];
    const opac = [.55, 1, .7, .85];
    const serEsc = Object.entries(esc.series).map(([nombre, vals], i) => ({
      name: nombre, type: 'line', symbol: 'none', data: vals.map((v, j) => [desde + j, v]),
      lineStyle: { width: i === 1 ? 2 : 1.5, color: col('Milei'), type: estilos[i][1], opacity: opac[i] },
      itemStyle: { color: col('Milei') },
    }));
    const reales = gobs.map(g => ({
      name: `${g} (real)`, type: 'line', symbol: 'none', lineStyle: { width: 2.5, color: col(g) }, itemStyle: { color: col(g) },
      data: d.trayectorias[g].map((v, i) => [i, v]).filter(p => p[1] != null),
      endLabel: g !== 'Milei' ? { show: true, color: T.fg, fontFamily: T.num, fontSize: 11, formatter: p => `${g} ${pct(p.value[1], 0)}` } : undefined,
    }));
    nuevo(document.getElementById('ch-esc'), {
      grid: { left: 8, right: 125, top: 56, bottom: 28, containLabel: true },
      legend: { top: 0, left: 0, textStyle: { color: T.fg2, fontSize: 11 }, itemWidth: 22, itemHeight: 2, itemGap: 12 },
      xAxis: ejeX({ type: 'value', min: 0, max: d.fin_mandato, interval: 12, name: 'meses de gobierno', nameLocation: 'middle', nameGap: 24,
        nameTextStyle: { color: T.fg3, fontSize: 11 }, axisLabel: { color: T.fg3, fontFamily: T.num, fontSize: 11 } }),
      yAxis: ejeY({}),
      tooltip: Object.assign(base().tooltip, { formatter: p => `Mes ${p[0].value[0]}<br>` +
        p.map(s => `${marca(s.color)}${s.seriesName}: <b>${pct(s.value[1], 0)}</b>`).join('<br>') }),
      series: [...reales, ...serEsc],
    });

    const cierre = d.cierre_mandato, max = Math.max(...cierre.map(c => c.acumulada || 0));
    document.getElementById('tb-cierre').innerHTML =
      `<thead><tr><th>Caso</th><th>Acumulada</th><th>Interanual final</th></tr></thead><tbody>` +
      cierre.map(c => `<tr><td><span class="gob"><i style="background:${col(c.gobierno)}${c.caso.includes('(real)') ? '' : ';opacity:.55'}"></i>${c.caso}</span></td>` +
        `<td class="barra" style="--w:${(c.acumulada / max * 100).toFixed(1)}%;--c:${col(c.gobierno)}"><span>${pct(c.acumulada, 0)}</span></td><td>${pct(c.interanual_final, 0)}</td></tr>`).join('') +
      `</tbody>`;
  }

  // ---------- ayudas ----------
  function shift(ym, n) { const [a, m] = ym.split('-').map(Number); const t = a * 12 + (m - 1) + n; return `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, '0')}`; }
  function baseYM(etqBase, n) { const [m, a] = etqBase.split('-'); return shift(`20${a}-${String(MES.indexOf(m) + 1).padStart(2, '0')}`, n); }
  function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
  function seguir(id, fn) {
    const g = document.getElementById(id);
    g.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      g.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      fn(b.dataset.v);
    });
  }

  fetch('data/dashboard.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(e => {
      document.getElementById('estado').textContent = 'No se pudieron cargar los datos (data/dashboard.json). Revisá que la Action haya corrido al menos una vez.';
      document.getElementById('meta').innerHTML = '<span>sin datos</span>';
      console.error(e);
    });
})();
</script>
</body>
</html>
