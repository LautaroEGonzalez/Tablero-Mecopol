<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero de Precios MECOPOL</title>
<meta name="description" content="Inflación durante el gobierno de Milei con datos del INDEC: mes a mes y por rubro. Mesa de Economía Política UNLa.">
<link rel="icon" type="image/png" href="img/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: una sola columna de lectura (máx. 1200px). Arriba la cifra del mes,
   después la serie y los rubros. Pocos bordes, mucho aire.
   Tema oscuro único, elegido a propósito. */
:root {
  color-scheme: dark;
  --bg:       #0e1014;
  --panel:    #14171c;
  --panel-hi: #1b1f26;
  --line:     #23272f;
  --grid:     #1f232a;
  --fg:       #e3e5ea;
  --fg-2:     #a3a9b6;
  --fg-3:     #6f7685;
  --marca:    #950b32;   /* bordó de MECOPOL (banner) */
  --accent:   #e0527c;   /* rosa del logo, para las marcas de los gráficos */
  --sube:     #e66767;   /* rubro que se encareció más que el promedio */
  --baja:     #3987e5;   /* rubro que se encareció menos */
  --good:     #3fb27f;
  --warn:     #e0a33a;
  --font-ui:  "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.55 var(--font-ui);
  padding-inline: 16px; padding-block: 0 48px;
}
a { color: var(--fg); text-underline-offset: 2px; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.wrap { max-width: 1200px; margin-inline: auto; display: flex; flex-direction: column; gap: 40px; padding-top: 28px; }

/* ---- banner con la identidad de MECOPOL ---- */
.banda {
  margin-inline: -16px; padding: 24px 16px 22px;
  background: var(--marca); color: #fff;
  border-bottom: 3px solid #6e0824;
}
.banda-in { max-width: 1200px; margin-inline: auto; display: flex; align-items: center; gap: 22px; }
.marca {
  flex: none; display: block; background: #fff; border-radius: 10px; padding: 6px;
  box-shadow: 0 1px 0 rgba(0,0,0,.25);
}
.marca img { display: block; width: 92px; height: auto; }
.banda-txt { flex: 1; min-width: 0; display: grid; gap: 10px; }
.eyebrow {
  font: 600 12px var(--font-ui); font-stretch: 80%; letter-spacing: .14em; text-transform: uppercase;
  color: rgba(255,255,255,.78); display: flex; flex-wrap: wrap; gap: 4px 14px;
}
h1 {
  margin: 0; font-weight: 600; font-stretch: 85%; letter-spacing: -.01em; color: #fff;
  font-size: clamp(26px, 4vw, 42px); line-height: 1.08; text-wrap: balance;
}
.mandato { display: grid; gap: 6px; max-width: 560px; }
.mandato:empty { display: none; }
.mandato .barra { height: 6px; background: rgba(0,0,0,.28); border-radius: 3px; overflow: hidden; }
.mandato .barra i { display: block; height: 100%; background: #fff; border-radius: 3px; }
.mandato .txt { display: flex; justify-content: space-between; gap: 12px; font: 12px var(--font-num); color: rgba(255,255,255,.75); }
.mandato .txt b { color: #fff; font-weight: 500; }
@media (max-width: 560px) {
  .banda-in { flex-direction: column; align-items: flex-start; gap: 14px; }
  .marca img { width: 72px; }
}

.aviso {
  padding: 9px 13px; border-radius: var(--r); font-size: 13px;
  background: #221d10; color: #e9cf8f; border: 1px solid #4d3f19;
}

/* ---- cifras ---- */
.cifras {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.cifra { padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cifra + .cifra { border-left: 1px solid var(--line); }
.cifra h2 { margin: 0; font-size: 13px; font-weight: 500; color: var(--fg-2); }
.cifra .valor { font: 600 40px/1.05 var(--font-num); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.cifra .valor small { font-size: 20px; color: var(--fg-3); margin-left: 2px; }
.cifra .pie { font-size: 12px; color: var(--fg-3); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 3px; font: 500 12px var(--font-num); border: 1px solid currentColor; }
.chip.baja { color: var(--good); } .chip.sube { color: var(--warn); } .chip.igual { color: var(--fg-2); }
.spark { width: 100%; height: 38px; }
@media (max-width: 900px) {
  .cifras { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cifra:nth-child(3) { border-left: 0; }
  .cifra:nth-child(n+3) { border-top: 1px solid var(--line); }
}
@media (max-width: 480px) {
  .cifras { grid-template-columns: 1fr; }
  .cifra + .cifra { border-left: 0; border-top: 1px solid var(--line); }
  .cifra .valor { font-size: 34px; }
}

/* ---- secciones ---- */
.sec { display: grid; gap: 14px; }
.sec-cab { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 20px; }
.sec-cab > div { flex: 1 1 320px; min-width: 0; }
.sec h2 { margin: 0; font-size: 20px; font-weight: 600; font-stretch: 90%; text-wrap: balance; }
.sec p.sub { margin: 4px 0 0; color: var(--fg-2); font-size: 14px; max-width: 68ch; }
.caja { background: var(--panel); border-radius: var(--r); padding: 16px; min-width: 0; }
.chart { width: 100%; height: 360px; }
@media (max-width: 560px) { .chart { height: 300px; } }

.seg { display: inline-flex; background: var(--panel); border-radius: var(--r); padding: 3px; gap: 2px; }
.seg button {
  font: 500 13px var(--font-ui); color: var(--fg-2); background: transparent; border: 0;
  padding: 5px 12px; border-radius: 4px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--panel-hi); color: var(--fg); }
.seg button:hover { color: var(--fg); }

.lectura { margin: 0; color: var(--fg-2); font-size: 14px; max-width: 72ch; }
.lectura b { color: var(--fg); font-weight: 600; }

/* ---- tabla de rubros ---- */
.tabla-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px; }
th, td { padding: 9px 10px; text-align: right; white-space: nowrap; }
th { color: var(--fg-3); font-weight: 500; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
td { font-family: var(--font-num); font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
td:first-child { font-family: var(--font-ui); color: var(--fg); }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--panel-hi); }
th.rel, td.rel { width: 38%; text-align: center; }
.div { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 0; position: relative; height: 18px; }
.div::after { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--fg-3); }
.div .izq, .div .der { display: flex; align-items: center; gap: 6px; height: 100%; }
.div .izq { justify-content: flex-end; }
.div .pista { flex: 1; display: flex; height: 10px; }
.div .izq .pista { justify-content: flex-end; }
.div i { display: block; height: 10px; min-width: 2px; }
.div .izq i { background: var(--baja); border-radius: 2px 0 0 2px; }
.div .der i { background: var(--sube); border-radius: 0 2px 2px 0; }
.div span { flex: none; width: 52px; font-size: 12px; color: var(--fg-2); }
.div .der span { text-align: left; } .div .izq span { text-align: right; }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--fg-3); }
.leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* ---- pie ---- */
.notas { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px 32px; border-top: 1px solid var(--line); padding-top: 22px; }
.notas h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
.notas p { margin: 0; font-size: 13px; color: var(--fg-2); max-width: 62ch; }
code { font-family: var(--font-num); font-size: 12px; background: var(--panel-hi); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }
.estado { padding: 60px 0; color: var(--fg-2); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="banda">
  <div class="banda-in">
    <a class="marca" href="https://mecopolunla.wixsite.com/mecopol" target="_blank" rel="noopener">
      <img src="img/logo-mecopol.png" width="320" height="316" alt="MECOPOL · Mesa de Economía Política · Universidad Nacional de Lanús">
    </a>
    <div class="banda-txt">
      <div class="eyebrow" id="eyebrow"><span>Tablero de precios</span><span>Mesa de Economía Política UNLa</span><span>Datos: INDEC</span></div>
      <h1>Inflación en el gobierno de Milei</h1>
      <div class="mandato" id="mandato"></div>
    </div>
  </div>
</header>

<div class="wrap" id="app">
  <div class="estado">Cargando datos del INDEC…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script>
(() => {
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const T = { fg: css('--fg'), fg2: css('--fg-2'), fg3: css('--fg-3'), grid: css('--grid'), line: css('--line'),
    panel: css('--panel'), accent: css('--accent'), num: css('--font-num'), ui: css('--font-ui') };
  const nf = (v, d = 1) => v == null ? '—' : v.toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const pct = (v, d = 1, signo = false) => v == null ? '—' : (signo && v > 0 ? '+' : '') + nf(v, d) + '%';
  const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const MESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const etq = ym => { const [a, m] = ym.split('-'); return `${MES[+m - 1]}-${a.slice(2)}`; };
  const largo = ym => { const [a, m] = ym.split('-'); return `${MESL[+m - 1]} de ${a}`; };
  const corto = {
    'Alimentos y bebidas no alcohólicas': 'Alimentos y bebidas', 'Bebidas alcohólicas y tabaco': 'Alcohol y tabaco',
    'Prendas de vestir y calzado': 'Ropa y calzado', 'Vivienda, agua, electricidad, gas y otros combustibles': 'Vivienda y servicios',
    'Equipamiento y mantenimiento del hogar': 'Equipamiento del hogar', 'Bienes y servicios varios': 'Bienes y servicios varios',
  };
  const tip = () => ({
    trigger: 'axis', backgroundColor: '#1d2129', borderColor: T.line, borderWidth: 1,
    textStyle: { color: T.fg, fontSize: 12, fontFamily: T.ui }, extraCssText: 'border-radius:6px;',
    axisPointer: { type: 'line', lineStyle: { color: T.fg3, width: 1 } },
  });
  const ejeX = extra => Object.assign({ axisLine: { lineStyle: { color: T.line } }, axisTick: { show: false },
    axisLabel: { color: T.fg3, fontFamily: T.num, fontSize: 11, hideOverlap: true }, splitLine: { show: false } }, extra);
  const ejeY = extra => Object.assign({ type: 'value', axisLine: { show: false }, axisTick: { show: false },
    axisLabel: { color: T.fg3, fontFamily: T.num, fontSize: 11, formatter: v => nf(v, 0) + '%' },
    splitLine: { lineStyle: { color: T.grid, width: 1 } } }, extra);
  const nuevo = (el, opt) => {
    const c = echarts.init(el);
    c.setOption(Object.assign({ backgroundColor: 'transparent', textStyle: { fontFamily: T.ui, color: T.fg2 }, animationDuration: 500 }, opt));
    new ResizeObserver(() => c.resize()).observe(el);
    return c;
  };
  const chip = (a, p, unidad = 'pp') => {
    if (a == null || p == null) return '';
    const d = a - p, c = Math.abs(d) < 0.05 ? 'igual' : d < 0 ? 'baja' : 'sube';
    return `<span class="chip ${c}" title="${c === 'baja' ? 'Bajó' : c === 'sube' ? 'Subió' : 'Igual'} respecto del mes anterior">${c === 'baja' ? '▼' : c === 'sube' ? '▲' : '■'} ${nf(Math.abs(d), 1)} ${unidad}</span>`;
  };

  function render(d) {
    const k = d.kpis, M = d.ultimo_mes, K = d.mes_gobierno, total = K + d.meses_restantes;
    const app = document.getElementById('app');
    const act = new Date(d.actualizado);

    document.getElementById('eyebrow').insertAdjacentHTML('beforeend',
      `<span>Actualizado ${act.toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: 'numeric' })}</span>`);
    const man = document.getElementById('mandato');
    man.setAttribute('role', 'img'); man.setAttribute('aria-label', `Mes ${K} de ${total} del mandato`);
    man.innerHTML = `<div class="barra"><i style="width:${(K / total * 100).toFixed(1)}%"></i></div>
      <div class="txt"><span>dic-23</span><span>Mes <b>${K}</b> de ${total} · último dato <b>${etq(M)}</b></span><span>${etq(d.fin_mandato)}</span></div>`;

    app.innerHTML = `
      ${d.simulado ? '<div class="aviso">Vista previa con datos de prueba (los de la planilla del equipo). En GitHub Pages se reemplazan solos por los datos reales del INDEC.</div>' : ''}

      <section class="cifras" aria-label="Cifras de ${largo(M)}">
        <div class="cifra"><h2>Inflación de ${MESL[+M.slice(5) - 1]}</h2><div class="valor">${nf(k.mensual, 2)}<small>%</small></div>
          <div class="pie">${chip(k.mensual, k.mensual_previo)}<span>mes anterior ${pct(k.mensual_previo, 2)}</span></div>
          <div class="spark" id="sp1" role="img" aria-label="Inflación mensual, últimos 12 meses"></div></div>
        <div class="cifra"><h2>Interanual</h2><div class="valor">${nf(k.interanual, 1)}<small>%</small></div>
          <div class="pie">${chip(k.interanual, k.interanual_previo)}<span>vs. ${etq(shift(M, -12))}</span></div>
          <div class="spark" id="sp2" role="img" aria-label="Inflación interanual, últimos 12 meses"></div></div>
        <div class="cifra"><h2>Acumulada ${M.slice(0, 4)}</h2><div class="valor">${nf(k.acum_anio, 1)}<small>%</small></div>
          <div class="pie"><span>desde dic-${String(+M.slice(0, 4) - 1).slice(2)}</span></div></div>
        <div class="cifra"><h2>Acumulada del gobierno</h2><div class="valor">${nf(k.acum_gobierno, 1)}<small>%</small></div>
          <div class="pie"><span>desde nov-23 · promedio ${pct(k.promedio_mensual, 2)} mensual</span></div></div>
      </section>

      <section class="sec">
        <div class="sec-cab">
          <div><h2>Mes a mes</h2><p class="sub">IPC nacional desde diciembre de 2023, el primer mes del gobierno.</p></div>
          <div class="seg" role="group" id="sel">${[['mensual', 'Mensual'], ['interanual', 'Interanual'], ['acumulada', 'Acumulada']]
            .map(([v, t], i) => `<button type="button" data-v="${v}" aria-pressed="${i === 0}">${t}</button>`).join('')}</div>
        </div>
        <div class="caja"><div class="chart" id="ch-serie"></div></div>
        <p class="lectura">El pico fue <b>${largo(d.hitos.pico.fecha)}</b>, con <b>${pct(d.hitos.pico.mensual, 1)}</b> mensual. En los primeros 5 meses los precios subieron <b>${pct(d.hitos.primeros_5, 0)}</b>; en los ${d.hitos.meses_resto} meses siguientes, <b>${pct(d.hitos.resto, 0)}</b>.</p>
      </section>

      <section class="sec">
        <div class="sec-cab"><div><h2>Rubros</h2>
          <p class="sub">El precio relativo compara cuánto subió cada rubro desde nov-23 con el nivel general. Positivo: se encareció más que el promedio.</p></div></div>
        <div class="caja">
          <div class="tabla-wrap"><table>
            <thead><tr><th>Rubro</th><th class="rel">Precio relativo</th><th>${etq(M)}</th><th>Interanual</th><th>Desde nov-23</th></tr></thead>
            <tbody id="tb-rubros"></tbody>
          </table></div>
        </div>
        <div class="leyenda"><span><i style="background:var(--sube)"></i>Se encareció más que el promedio</span><span><i style="background:var(--baja)"></i>Se encareció menos</span><span>Nivel general: ${pct(k.mensual, 2)} en ${etq(M)} · ${pct(k.acum_gobierno, 1)} desde nov-23</span></div>
      </section>

      <footer class="notas">
        <div><h3>Fuente</h3><p>IPC Nacional del INDEC (base diciembre 2016 = 100), vía la API de Series de Tiempo de datos.gob.ar. El tablero se revisa todos los días; el INDEC publica a mediados de cada mes.</p></div>
        <div><h3>Punto de partida</h3><p>El gobierno asumió el 10 de diciembre de 2023, así que la base es noviembre de 2023. Eso incluye diciembre (${pct(d.hitos.pico.mensual, 1)}), el mes de la devaluación.</p></div>
        <div><h3>Series</h3><p><code>${d.fuentes.nivel_general}</code> y ${Object.keys(d.fuentes.divisiones).length} divisiones nacionales del IPC.</p></div>
      </footer>`;

    // ---- sparklines ----
    const ult = d.serie.slice(-12);
    const spark = (id, campo, dec) => nuevo(document.getElementById(id), {
      grid: { left: 0, right: 4, top: 4, bottom: 2 },
      tooltip: Object.assign(tip(), { axisPointer: { type: 'none' }, formatter: p => `${etq(p[0].name)}: <b>${pct(p[0].value, dec)}</b>` }),
      xAxis: { type: 'category', data: ult.map(x => x.fecha), show: false, boundaryGap: false },
      yAxis: { type: 'value', show: false, scale: true },
      series: [{ type: 'line', data: ult.map(x => x[campo]), symbol: 'none', lineStyle: { width: 1.5, color: T.fg2 },
        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(163,169,182,.22)' }, { offset: 1, color: 'rgba(163,169,182,0)' }]) },
        markPoint: { symbol: 'circle', symbolSize: 6, itemStyle: { color: T.fg }, label: { show: false }, data: [{ coord: [ult.length - 1, ult[ult.length - 1][campo]] }] } }],
    });
    spark('sp1', 'mensual', 2); spark('sp2', 'interanual', 1);

    // ---- serie ----
    const xs = d.serie.map(x => x.fecha);
    const ch = nuevo(document.getElementById('ch-serie'), {});
    const dibujar = medida => {
      const ys = d.serie.map(x => x[medida]), dec = medida === 'mensual' ? 2 : 1, ultI = ys.length - 1;
      const barras = medida === 'mensual';
      const serie = barras ? {
        type: 'bar', data: ys.map((v, i) => ({ value: v, itemStyle: { color: i === ultI ? T.accent : '#59606e', borderRadius: [3, 3, 0, 0] } })),
        barWidth: '62%',
        label: { show: true, position: 'top', fontFamily: T.num, fontSize: 11, color: T.fg2,
          formatter: p => (p.dataIndex === 0 || p.dataIndex === ultI) ? nf(p.value, 1) : '' },
      } : {
        type: 'line', data: ys, symbol: 'none', lineStyle: { width: 2.5, color: T.accent },
        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(224,82,124,.22)' }, { offset: 1, color: 'rgba(224,82,124,0)' }]) },
        markPoint: { symbol: 'circle', symbolSize: 8, itemStyle: { color: T.accent, borderColor: T.panel, borderWidth: 2 },
          label: { show: true, position: 'top', color: T.fg, fontFamily: T.num, fontSize: 11, formatter: () => pct(ys[ultI], dec) },
          data: [{ coord: [ultI, ys[ultI]] }] },
      };
      ch.setOption({
        grid: { left: 4, right: 24, top: 28, bottom: 4, containLabel: true },
        tooltip: Object.assign(tip(), barras ? { axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(255,255,255,.04)' } } } : {},
          { formatter: p => `${largo(p[0].name)}<br>${medida[0].toUpperCase() + medida.slice(1)}: <b>${pct(p[0].value, dec)}</b>` }),
        xAxis: ejeX({ type: 'category', data: xs, boundaryGap: barras, axisLabel: { color: T.fg3, fontFamily: T.num, fontSize: 11, formatter: etq, hideOverlap: true } }),
        yAxis: ejeY({}),
        series: [serie],
      }, { replaceMerge: ['series', 'xAxis'] });
    };
    dibujar('mensual');
    document.getElementById('sel').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      e.currentTarget.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      dibujar(b.dataset.v);
    });

    // ---- rubros ----
    const rs = [...d.rubros].sort((a, b) => b.relativo - a.relativo);
    const maxRel = Math.max(...rs.map(r => Math.abs(r.relativo)));
    document.getElementById('tb-rubros').innerHTML = rs.map(r => {
      const w = (Math.abs(r.relativo) / maxRel * 100).toFixed(1);
      const barra = r.relativo >= 0
        ? `<div class="izq"></div><div class="der"><b class="pista"><i style="width:${w}%"></i></b><span>${pct(r.relativo, 1, true)}</span></div>`
        : `<div class="izq"><span>${pct(r.relativo, 1, true)}</span><b class="pista"><i style="width:${w}%"></i></b></div><div class="der"></div>`;
      return `<tr><td>${corto[r.rubro] || r.rubro}</td><td class="rel"><div class="div">${barra}</div></td>` +
        `<td>${pct(r.mensual, 1)}</td><td>${pct(r.interanual, 1)}</td><td>${pct(r.acum_gobierno, 0)}</td></tr>`;
    }).join('');

  }

  function shift(ym, n) { const [a, m] = ym.split('-').map(Number); const t = a * 12 + (m - 1) + n; return `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, '0')}`; }

  fetch('data/dashboard.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(e => {
      document.getElementById('app').innerHTML = '<div class="estado">No se pudieron cargar los datos (data/dashboard.json). Revisá que la Action haya corrido al menos una vez.</div>';
      console.error(e);
    });
})();
</script>
</body>
</html>
