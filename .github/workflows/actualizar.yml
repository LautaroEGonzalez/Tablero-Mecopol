name: Actualizar datos

# Corre todos los días a las 18:30 de Argentina (21:30 UTC), después de que el
# INDEC publica (16 h). También se puede correr a mano desde la pestaña Actions,
# y corre sola cuando se cambia el script o la configuración.
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config.json"
      - "fuentes/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Bajar datos y calcular indicadores
        run: python scripts/actualizar.py

      - name: Serie histórica por gobierno (Mirada larga)
        # si falla, la portada se actualiza igual y la página histórica queda con sus últimos datos
        continue-on-error: true
        run: python scripts/historia.py

      - name: Guardar cambios (solo si hay datos nuevos)
        run: |
          git config user.name  "mecopol-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos actualizados $(date -u +%Y-%m-%d)"
            git push
          fi
