name: Actualizar datos

# Corre todos los días a las 18:30 de Argentina (21:30 UTC), después de que el
# INDEC publica (16 h). También se puede correr a mano desde la pestaña Actions,
# y corre sola cuando se cambia el script o la configuración.
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config.json"
      - "fuentes/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Mes publicado antes de actualizar
        id: antes
        run: echo "mes=$(python -c 'import json;print(json.load(open("docs/data/dashboard.json"))["ultimo_mes"])')" >> "$GITHUB_OUTPUT"

      - name: Bajar datos y calcular indicadores
        env:
          INDEC_API_TOKEN: ${{ secrets.INDEC_API_TOKEN }}   # API del INDEC (secreto del repositorio)
        run: python scripts/actualizar.py

      - name: Guardar cambios (solo si hay datos nuevos)
        run: |
          git config user.name  "mecopol-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos actualizados $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Avisar si el token del INDEC fue rechazado
        run: |
          if [ -f "$RUNNER_TEMP/indec_token_rechazado" ]; then
            echo "::error::La API del INDEC rechazó el token (vencido o revocado). Generá uno nuevo en api.indec.gob.ar y actualizá el secreto INDEC_API_TOKEN en Settings → Secrets and variables → Actions."
            exit 1
          fi

      # ---- Avisos por Telegram (secretos TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID) ----
      - name: Avisar por Telegram si hay un mes nuevo
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          MES_ANTES: ${{ steps.antes.outputs.mes }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          read -r MES MENS IA <<< "$(python -c 'import json;d=json.load(open("docs/data/dashboard.json"));k=d["kpis"];print(d["ultimo_mes"],k["mensual"],k["interanual"])')"
          [ "$MES" != "$MES_ANTES" ] || exit 0
          TXT="📊 Tablero MECOPOL actualizado: IPC $MES = ${MENS}% mensual, ${IA}% interanual.
          https://lautaroegonzalez.github.io/Tablero-Mecopol/"
          curl -sS -o /dev/null -w "Telegram: HTTP %{http_code}\n" "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${TXT}" --data-urlencode "disable_web_page_preview=true"

      - name: Avisar por Telegram si algo falló
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          if [ -f "$RUNNER_TEMP/indec_token_rechazado" ]; then
            MOTIVO="La API del INDEC rechazó el token (vencido o revocado). Generá uno nuevo en api.indec.gob.ar y actualizá el secreto INDEC_API_TOKEN."
          else
            MOTIVO="La actualización del tablero falló. La página sigue con los últimos datos buenos."
          fi
          TXT="⚠️ Tablero MECOPOL: ${MOTIVO}
          Detalle: ${RUN_URL}"
          curl -sS -o /dev/null -w "Telegram: HTTP %{http_code}\n" "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${TXT}" --data-urlencode "disable_web_page_preview=true"
