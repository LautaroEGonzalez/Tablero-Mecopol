name: Diagnóstico (temporal)
on: workflow_dispatch
jobs:
  ver:
    runs-on: ubuntu-24.04
    steps:
      - name: Escalas nodocentes en instructivos (UNCuyo y UTN)
        run: |
          pip install -q pypdf
          python3 - << 'PY'
          import urllib.request, io, re
          from pypdf import PdfReader
          UA = {"User-Agent": "Mozilla/5.0"}
          def pdfs_de(pagina, raiz):
              h = urllib.request.urlopen(urllib.request.Request(pagina, headers=UA), timeout=60).read().decode("utf-8", "replace")
              out = []
              for l in sorted(set(re.findall(r'href="([^"]+\.pdf)"', h, re.I))):
                  out.append(l if l.startswith("http") else raiz + "/" + l.lstrip("/"))
              return out
          urls = pdfs_de("https://www.uncuyo.edu.ar/transparencia/escalas-salariales-y-convenios", "https://www.uncuyo.edu.ar")
          res = {}
          for url in urls:
              try:
                  b = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read()
                  t = "\n".join(pg.extract_text() or "" for pg in PdfReader(io.BytesIO(b)).pages)
              except Exception as e:
                  print(f"::notice::ERR {url} {e}"); continue
              # tabla nodocente: 'CATEGORÍA mes-aa [mes-aa ...]' y luego filas 1..7
              for m in re.finditer(r"CATEGOR[IÍ]A\s+((?:[a-zA-Z]{3,5}[-/ ]?\d{2}\s+){1,4})", t):
                  meses = m.group(1).split()
                  resto = t[m.end():m.end()+900]
                  filas = re.findall(r"(?m)^\s*([1-7])\s+((?:\d{1,3}(?:\.\d{3})*,\d{2}\s*){%d})" % len(meses), resto)
                  if len(filas) >= 7:
                      for cat, vals in filas[:7]:
                          v = vals.split()
                          for k, mes in enumerate(meses):
                              res.setdefault(mes, {})[cat] = v[k]
          linea = " | ".join(f"{mes}: c1={d.get('1')} c3={d.get('3')} c7={d.get('7')}" for mes, d in sorted(res.items(), key=lambda x: (x[0][-2:], x[0])))
          for k in range(0, len(linea), 3800):
              print("::notice::" + linea[k:k+3800])
          print(f"::notice::{len(urls)} pdf, {len(res)} meses")
          PY
