name: Diagnóstico (temporal)
on: workflow_dispatch
jobs:
  ver:
    runs-on: ubuntu-24.04
    steps:
      - name: Instructivo UNGS junio-agosto 2025 y mayo 2025
        run: |
          pip install -q pypdf
          python3 - << 'PY'
          import urllib.request, io, re
          from pypdf import PdfReader
          for url in ["https://transparencia.ungs.edu.ar/wp-content/uploads/2025/08/Instructivo-de-Liquidacion-Docentes-y-No-Docentes-Junio-a-Agosto-2025.pdf",
                      "https://transparencia.ungs.edu.ar/wp-content/uploads/2025/06/Instructivo-de-Liquidacion-Docentes-y-No-Docentes-Mayo-2025.pdf"]:
              try:
                  b = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=60).read()
                  t = "\n".join(pg.extract_text() or "" for pg in PdfReader(io.BytesIO(b)).pages)
                  t = re.sub(r"[ \t]+", " ", t)
                  partes = [t[i:i+3800] for i in range(0, min(len(t), 3800*4), 3800)]
                  for k, p in enumerate(partes):
                      print(f"::notice::{url.rsplit('/',1)[-1]} [{k}] " + p.replace("\n", " ¶ "))
              except Exception as e:
                  print(f"::notice::{url} error {e}")
          PY
