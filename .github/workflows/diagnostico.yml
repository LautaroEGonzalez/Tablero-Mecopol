name: Diagnóstico (temporal)
on: workflow_dispatch
jobs:
  ver:
    runs-on: ubuntu-24.04
    steps:
      - name: Categoría 7 nodocente, escalas UNC
        run: |
          python3 - << 'PY'
          import json, urllib.request, urllib.parse, csv, io
          api = "https://datosabiertos.unc.edu.ar/api/3/action/"
          j = json.load(urllib.request.urlopen(api + "package_search?" + urllib.parse.urlencode({"q": "escalas salariales nodocentes", "rows": 100}), timeout=60))
          out = []
          for p in sorted(j["result"]["results"], key=lambda p: p["name"]):
              if not p["name"].startswith("escalas-salariales-nodocentes"): continue
              for res in p["resources"]:
                  if not res["url"].lower().endswith(".csv"): continue
                  t = urllib.request.urlopen(res["url"], timeout=60).read().decode("utf-8-sig", "replace")
                  rows = list(csv.reader(io.StringIO(t), delimiter=";"))
                  c7 = [r for r in rows[1:] if r and r[0].startswith("Categ 7")]
                  out.append(f"{p['name'][-7:]}={c7[0][2] if c7 else 'NA'}")
                  break
          print("::notice::" + " | ".join(out))
          PY
      - name: Escalas en sitios de universidades
        run: |
          python3 - << 'PY'
          import urllib.request, re
          for url in ["https://www.unaj.edu.ar/transparencia/escalas-salariales/",
                      "https://unlp.edu.ar/gestion/administracion_y_finanzas/transparencia/escalas-salariales-11879-16879/",
                      "https://www.uncuyo.edu.ar/transparencia/escalas-salariales-y-convenios",
                      "https://transparencia.uno.edu.ar/escalas-salariales/"]:
              try:
                  h = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=60).read().decode("utf-8", "replace")
                  links = sorted(set(re.findall(r'href="([^"]+\.(?:pdf|xlsx?|csv))"', h, re.I)))
                  nd = [l for l in links if re.search(r"no.?docen", l, re.I)]
                  print(f"::notice::{url} → {len(links)} archivos, {len(nd)} nodocentes: " + " ".join(nd)[:3500])
              except Exception as e:
                  print(f"::notice::{url} → error {e}")
          PY
