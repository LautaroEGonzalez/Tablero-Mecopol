name: Diagnóstico (temporal)
on: workflow_dispatch
jobs:
  ver:
    runs-on: ubuntu-24.04
    steps:
      - name: Categoría 7 nodocente, escalas UNC
        run: |
          python3 - << 'PY'
          import json, urllib.request, urllib.parse, csv, io
          api = "https://datosabiertos.unc.edu.ar/api/3/action/"
          j = json.load(urllib.request.urlopen(api + "package_search?" + urllib.parse.urlencode({"q": "escalas salariales nodocentes", "rows": 100}), timeout=60))
          out = []
          for p in sorted(j["result"]["results"], key=lambda p: p["name"]):
              if not p["name"].startswith("escalas-salariales-nodocentes"): continue
              res = p["resources"][0]
              try:
                  t = urllib.request.urlopen(res["url"], timeout=60).read().decode("utf-8-sig", "replace")
                  sep = ";" if t.split("\n")[0].count(";") > t.split("\n")[0].count(",") else ","
                  rows = list(csv.reader(io.StringIO(t), delimiter=sep))
                  c7 = [r for r in rows[1:] if r and "7" in r[0][:8]]
                  out.append(f"{p['name'][-6:]}={c7[0][2] if c7 else 'NA'}")
                  if p["name"].endswith("202509"): print("::notice::muestra 202509: " + repr(rows[:3])[:900])
              except Exception as e:
                  out.append(f"{p['name'][-6:]}=ERR {e}")
          print("::notice::" + " | ".join(out)[:4000])
          PY
      - name: Instructivos UNGS
        if: always()
        run: |
          python3 - << 'PY'
          import urllib.request, re
          for url in ["https://transparencia.ungs.edu.ar/escalas-salariales/", "https://transparencia.ungs.edu.ar/"]:
              try:
                  h = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=60).read().decode("utf-8", "replace")
                  links = sorted(set(re.findall(r'href="([^"]+\.pdf)"', h, re.I)))
                  ins = [l.rsplit("/", 1)[-1] for l in links if re.search(r"instructivo|no.?docen|escala", l, re.I)]
                  print(f"::notice::{url} → {len(links)} pdf: " + " ".join(ins)[:3800])
              except Exception as e:
                  print(f"::notice::{url} → error {e}")
          PY
